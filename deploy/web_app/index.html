<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="gomoku-asset-base" content="">
    <title>Askr五子棋</title>
    <link rel="stylesheet" href="styles.css?v=20260726-orbit-retune">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" style="display: none;">
        <h1 data-i18n="title">Askr五子棋</h1>
        <!-- Worker-backed orbit canvas injected by createOrbitLoader -->
        <div class="loading-orbit" id="loading-orbit"></div>
        <!-- EP-probe progress: minimal bar, one segment per probe phase -->
        <div id="probe-progress" class="probe-progress" style="display: none;">
            <div class="probe-progress-track">
                <div id="probe-progress-fill" class="probe-progress-fill"></div>
            </div>
        </div>
        <!-- Text set from JS (phase + params tracked for language switching) -->
        <p id="loading-message"></p>
        <div class="loading-poem-container">
            <div id="loading-poem" class="loading-poem"></div>
        </div>

        <!-- Melody-difficulty dialog: per-move-time acknowledgment after the
             EP probe, also reused for download/probe failure messages
             (visible buttons vary per situation) -->
        <div id="probe-dialog" class="probe-dialog" style="display: none;">
            <div id="probe-result-heading" class="probe-result-heading"></div>
            <div id="probe-result-time" class="probe-result-time"></div>
            <p id="probe-result-text"></p>
            <div class="probe-choices">
                <button id="btn-probe-ok" class="btn-primary" data-i18n="probe_choice_ok">开始对局</button>
                <button id="btn-probe-curtain" class="btn-secondary" data-i18n="probe_choice_curtain">改用高级难度</button>
                <button id="btn-probe-back" class="btn-secondary" data-i18n="probe_choice_back">返回设置</button>
            </div>
            <button id="btn-probe-retest" class="probe-retest-link" data-i18n="probe_choice_retest">重新测试</button>
        </div>
    </div>

    <!-- Setup Panel -->
    <div id="setup-panel" style="display: none;">
        <h1 data-i18n="title">Askr五子棋</h1>
        <div class="setup-content">
            <label data-i18n="your_pieces">你的执子：</label>
            <div class="button-group">
                <button id="btn-black" class="btn-color active" data-color="1" data-i18n="black_first">⚫ 黑棋（先手）</button>
                <button id="btn-white" class="btn-color" data-color="2" data-i18n="white_second">⚪ 白棋（后手）</button>
            </div>

            <label data-i18n="your_opponent">你的对手：</label>
            <div class="difficulty-group">
                <button class="btn-difficulty" data-difficulty="dial">
                    <div class="difficulty-name">Dial</div>
                    <div class="difficulty-info" data-i18n="level_dial">初级</div>
                    <div class="difficulty-info" data-i18n="desc_dial">经典模型</div>
                </button>
                <button class="btn-difficulty active" data-difficulty="cello">
                    <div class="difficulty-name">Cello</div>
                    <div class="difficulty-info" data-i18n="level_cello">中级</div>
                    <div class="difficulty-info" data-i18n="desc_cello">进阶模型</div>
                </button>
                <button class="btn-difficulty" data-difficulty="curtain">
                    <div class="difficulty-name">Curtain</div>
                    <div class="difficulty-info" data-i18n="level_curtain">高级</div>
                    <div class="difficulty-info" data-i18n="desc_curtain">后训练</div>
                </button>
                <button class="btn-difficulty" data-difficulty="melody">
                    <div class="difficulty-name">Melody</div>
                    <div class="difficulty-info" data-i18n="level_melody">大师</div>
                    <div class="difficulty-info" data-i18n="desc_melody">深度思考</div>
                </button>
            </div>

            <button id="btn-start" class="btn-primary" data-i18n="start_game">开始游戏</button>
            <p class="privacy-note" data-i18n="privacy_note">所有运算均在本地完成，我们不会收集任何使用数据。</p>
        </div>
    </div>

    <!-- Game Panel -->
    <div id="game-panel" style="display: none;">
        <h1 data-i18n="title">Askr五子棋</h1>

        <!-- Top Controls -->
        <div class="top-controls">
            <button id="btn-undo" class="btn-control" data-i18n="undo">悔棋</button>
            <span id="end-stat-left" class="end-stat"></span>
            <div id="status-text" aria-live="polite">
                <span id="status-orbit" aria-hidden="true"></span>
                <span id="status-label">你的回合</span>
            </div>
            <button id="btn-restart" class="btn-control" data-i18n="new_game">新游戏</button>
            <span id="end-stat-right" class="end-stat"></span>
        </div>

        <!-- Canvas Board -->
        <div class="board-container">
            <canvas id="game-board" width="600" height="600"></canvas>
        </div>

        <!-- Move Confirmation -->
        <div id="move-confirm" class="move-confirm">
            <button id="btn-confirm-move" class="btn-confirm" data-i18n="confirm_move">确认落子</button>
            <button id="btn-cancel-move" class="btn-cancel" data-i18n="cancel">取消</button>
        </div>

        <!-- End Actions (replaces move-confirm when game ends) -->
        <div id="end-actions" class="end-actions" style="display: none;">
            <button id="btn-end-new-game" class="btn-confirm" data-i18n="new_game">新游戏</button>
            <button id="btn-share" class="btn-cancel" data-i18n="generate_record">生成对局截图</button>
        </div>

        <p class="privacy-note" data-i18n="privacy_note">所有运算均在本地完成，我们不会收集任何使用数据。</p>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="result-title" data-i18n="game_over">游戏结束</h2>
            <p id="result-message"></p>
            <div id="result-stats" class="result-stats"></div>
            <button id="btn-play-again" class="btn-primary" data-i18n="play_again">再玩一局</button>
            <button id="btn-new-setup" class="btn-secondary" data-i18n="new_setup">新设置</button>
        </div>
    </div>

    <!-- Record Screen (numbered board for screenshots) -->
    <div id="record-screen" class="record-screen" style="display: none;">
        <button id="btn-record-close" class="btn-record-close">&times;</button>
        <div id="record-content" class="record-content">
            <div class="record-title" data-i18n="record_title">Askr五子棋</div>
            <div class="record-info">
                <div class="record-info-row">
                    <span id="record-black"></span>
                    <span id="record-white"></span>
                </div>
                <div class="record-info-row" id="record-info-row-2">
                    <span id="record-regret"></span>
                    <span id="record-length"></span>
                </div>
            </div>
            <div class="record-board-container">
                <canvas id="record-board"></canvas>
            </div>
            <div class="record-footer">gomoku.sance.xyz</div>
        </div>
    </div>

    <!-- Language Switcher -->
    <div class="lang-switch">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="en">English</button>
    </div>

    <!-- Credit -->
    <div class="credit">
        Credit: @Alkaid C.
        <a href="https://www.sance.xyz" target="_blank" rel="noopener noreferrer">Blog</a> |
        <a href="https://github.com/Alkaid-C/AskrGomoku" target="_blank" rel="noopener noreferrer">Github</a>
    </div>

    <!-- ONNX Runtime Web (self-hosted, WebGPU-capable bundle; wasm binaries
         load from vendor/ via ort.env.wasm.wasmPaths) -->
    <script src="vendor/ort.webgpu.min.js"></script>

    <!-- Asset URL resolver (release builds point it at an immutable directory) -->
    <script src="js/asset-paths.js"></script>

    <!-- i18n (must load before other modules) -->
    <script src="js/i18n.js"></script>

    <!-- Game modules -->
    <script src="js/orbit-physics.js?v=20260726-orbit-retune"></script>
    <script src="js/orbit-loader.js?v=20260726-orbit-retune"></script>
    <script src="js/gomoku-board.js?v=20260726-server-eval-cache"></script>
    <script src="js/mcts.js?v=20260726-server-eval-cache"></script>
    <script src="js/ep-probe.js"></script>
    <script src="js/eval-cache.js?v=20260726-server-eval-cache"></script>
    <script src="js/onnx-ai-player.js?v=20260726-server-eval-cache"></script>
    <script src="js/model-manager.js?v=20260726-server-eval-cache"></script>
    <script src="js/game-controller.js?v=20260726-server-eval-cache"></script>
</body>
</html>
