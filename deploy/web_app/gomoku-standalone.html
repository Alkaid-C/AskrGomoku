<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>Askr五子棋</title>
    <style>
/* 极简风格 CSS */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
    background: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    color: #333;
}

h1 {
    font-size: 2em;
    font-weight: 400;
    text-align: center;
    margin-bottom: 40px;
    color: #333;
}

/* ============================================================================
   Loading Screen
   ============================================================================ */

#loading-screen {
    text-align: center;
    max-width: 400px;
    width: 100%;
}

/* Loading Orbit Animation */
.loading-orbit {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 40px 0;
    min-height: 200px;
}

.loading-orbit svg {
    display: block;
}

#loading-message {
    font-size: 0.9em;
    color: #999;
}

/* ============================================================================
   Setup Panel
   ============================================================================ */

#setup-panel {
    text-align: center;
    max-width: 400px;
    width: 100%;
}

.setup-content {
    margin-top: 20px;
}

.setup-content label {
    display: block;
    font-size: 1em;
    color: #666;
    margin-bottom: 20px;
}

.button-group {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
}

.btn-color {
    flex: 1;
    padding: 12px 20px;
    font-size: 1em;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #333;
}

.btn-color:hover {
    border-color: #999;
}

.btn-color.active {
    border-color: #333;
    background: #333;
    color: white;
}

/* Difficulty Selection */
.difficulty-group {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
}

.btn-difficulty {
    flex: 1;
    padding: 15px 10px;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
}

.btn-difficulty:hover {
    border-color: #999;
}

.btn-difficulty.active {
    border-color: #333;
    background: #333;
    color: white;
}

.difficulty-name {
    font-family: 'Times New Roman', serif;
    font-size: 1.3em;
    font-style: italic;
    font-weight: normal;
    margin-bottom: 8px;
}

.difficulty-info {
    font-size: 0.75em;
    color: #999;
    line-height: 1.4;
}

.btn-difficulty.active .difficulty-info {
    color: #ccc;
}

.btn-primary {
    width: 100%;
    padding: 12px 30px;
    font-size: 1em;
    color: white;
    background: #333;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease;
}

.btn-primary:hover {
    background: #555;
}

.btn-primary:active {
    background: #222;
}

/* ============================================================================
   Game Panel
   ============================================================================ */

#game-panel {
    max-width: 700px;
    width: 100%;
}

/* Top Controls */
.top-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    gap: 20px;
}

#status-text {
    font-size: 1.1em;
    color: #333;
    text-align: center;
    flex: 1;
}

.btn-control {
    padding: 8px 20px;
    font-size: 0.9em;
    color: #666;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-control:hover {
    border-color: #999;
    color: #333;
}

.btn-control:active {
    background: #f5f5f5;
}

/* Board Container */
.board-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

#game-board {
    display: block;
    max-width: 100%;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

/* Move Confirmation */
.move-confirm {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
    visibility: hidden;
    min-height: 44px; /* 预留按钮高度，防止布局跳动 */
}

.move-confirm.visible {
    visibility: visible;
}

.btn-confirm,
.btn-cancel {
    padding: 10px 30px;
    font-size: 1em;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s ease;
    color: white;
}

.btn-confirm {
    background: #333;
}

.btn-confirm:hover {
    opacity: 0.8;
}

.btn-cancel {
    background: #999;
}

.btn-cancel:hover {
    opacity: 0.8;
}

/* ============================================================================
   Modal
   ============================================================================ */

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    text-align: center;
    max-width: 400px;
    width: 100%;
    padding: 20px;
}

.modal-content h2 {
    font-size: 1.8em;
    font-weight: 400;
    margin-bottom: 20px;
    color: #333;
}

.modal-content p {
    font-size: 1em;
    margin-bottom: 40px;
    color: #666;
}

.btn-secondary {
    width: 100%;
    padding: 12px 30px;
    font-size: 1em;
    color: #666;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 10px;
}

.btn-secondary:hover {
    border-color: #999;
    color: #333;
}

/* ============================================================================
   Credit
   ============================================================================ */

.credit {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 0.85em;
    color: #666;
}

.credit a {
    color: #666;
    text-decoration: none;
    transition: color 0.2s ease;
}

.credit a:hover {
    color: #333;
}

/* Privacy Note */
.privacy-note {
    font-size: 0.75em;
    color: #aaa;
    text-align: center;
    margin-top: 20px;
    line-height: 1.4;
}

/* ============================================================================
   Mobile Responsiveness
   ============================================================================ */

@media (max-width: 768px) {
    body {
        padding: 20px 15px;
    }

    h1 {
        font-size: 1.5em;
        margin-bottom: 30px;
    }

    .top-controls {
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    #status-text {
        order: -1;
        width: 100%;
        margin-bottom: 15px;
    }

    .btn-control {
        flex: 1;
    }
}

@media (max-width: 480px) {
    body {
        padding: 15px 10px;
    }

    h1 {
        font-size: 1.3em;
        margin-bottom: 20px;
    }

    /* 黑白棋选择保持横排 */
    .button-group {
        gap: 8px;
    }

    .btn-color {
        font-size: 0.9em;
        padding: 10px 12px;
    }

    /* 难度选择按钮竖排 */
    .difficulty-group {
        flex-direction: column;
        gap: 10px;
    }

    /* 按钮内部改为横排：左边名字，右边信息 */
    .btn-difficulty {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        text-align: left;
    }

    .difficulty-name {
        flex-shrink: 0;
        margin-bottom: 0;
        margin-right: 15px;
        font-size: 1.2em;
    }

    .difficulty-info {
        text-align: right;
        font-size: 0.65em;
        line-height: 1.3;
    }

    .top-controls {
        gap: 10px;
    }

    .btn-control {
        font-size: 0.85em;
        padding: 8px 15px;
    }
}

    <script>
/**
 * Gomoku Game Logic (JavaScript port of gomoku_board.py)
 *
 * Implements the game board and rules for Gomoku (Five-in-a-Row).
 */

// Game state constants
const GameState = {
    CONTINUE: 0,
    BLACK_WIN: 1,
    WHITE_WIN: 2,
    DRAW: 3
};

// Player constants
const Player = {
    BLACK: 1,
    WHITE: 2
};

/**
 * Gomoku Board Class
 * Manages a 15x15 board with piece placement and win detection.
 */
class GomokuBoard {
    constructor() {
        // Initialize 15x15 board
        this.blackPieces = Array(15).fill(null).map(() => Array(15).fill(0));
        this.whitePieces = Array(15).fill(null).map(() => Array(15).fill(0));
        this.whoToPlay = Player.BLACK;
        this.occupiedCount = 0;
    }

    /**
     * Make a move on the board.
     * @param {number} row - Row index (0-14)
     * @param {number} col - Column index (0-14)
     * @returns {number} GameState indicating the result
     */
    Move(row, col) {
        // Place piece
        if (this.whoToPlay === Player.BLACK) {
            this.blackPieces[row][col] = 1;
        } else {
            this.whitePieces[row][col] = 1;
        }

        this.occupiedCount++;

        // Check for win
        if (this._checkWin(this.whoToPlay, row, col)) {
            return this.whoToPlay === Player.BLACK ? GameState.BLACK_WIN : GameState.WHITE_WIN;
        }

        // Check for draw (board full)
        if (this.occupiedCount === 225) {
            return GameState.DRAW;
        }

        // Switch players
        this.whoToPlay = (this.whoToPlay === Player.BLACK) ? Player.WHITE : Player.BLACK;

        return GameState.CONTINUE;
    }

    /**
     * Check if the current move resulted in a win.
     * @param {number} player - Player who just moved
     * @param {number} row - Row of the last move
     * @param {number} col - Column of the last move
     * @returns {boolean} True if player won
     */
    _checkWin(player, row, col) {
        const pieces = (player === Player.BLACK) ? this.blackPieces : this.whitePieces;

        // Four directions to check: horizontal, vertical, diagonal, anti-diagonal
        const directions = [
            [0, 1],   // Horizontal
            [1, 0],   // Vertical
            [1, 1],   // Diagonal (\)
            [1, -1]   // Anti-diagonal (/)
        ];

        for (const [dr, dc] of directions) {
            let count = 1; // Count the placed stone itself

            // Count in positive direction
            let r = row + dr;
            let c = col + dc;
            while (r >= 0 && r < 15 && c >= 0 && c < 15 && pieces[r][c] === 1) {
                count++;
                r += dr;
                c += dc;
            }

            // Count in negative direction
            r = row - dr;
            c = col - dc;
            while (r >= 0 && r < 15 && c >= 0 && c < 15 && pieces[r][c] === 1) {
                count++;
                r -= dr;
                c -= dc;
            }

            if (count >= 5) {
                return true;
            }
        }

        return false;
    }

    /**
     * Get legal moves mask.
     * @returns {Array} [legalMask, nextPlayer] where legalMask is 15x15 array
     */
    GetLegalMoves() {
        const legalMask = Array(15).fill(null).map(() => Array(15).fill(0));

        for (let row = 0; row < 15; row++) {
            for (let col = 0; col < 15; col++) {
                if (this.blackPieces[row][col] === 0 && this.whitePieces[row][col] === 0) {
                    legalMask[row][col] = 1;
                }
            }
        }

        return [legalMask, this.whoToPlay];
    }

    /**
     * Get board state for neural network input.
     * Returns perspective of current player (current player's pieces as c0).
     * @returns {Array} [c0, c1, whoToPlay] where c0 is current player, c1 is opponent
     */
    GetBoardState() {
        let c0, c1;

        if (this.whoToPlay === Player.BLACK) {
            c0 = this.blackPieces.map(row => [...row]); // Deep copy
            c1 = this.whitePieces.map(row => [...row]);
        } else {
            c0 = this.whitePieces.map(row => [...row]);
            c1 = this.blackPieces.map(row => [...row]);
        }

        return [c0, c1, this.whoToPlay];
    }

    /**
     * Render board as text (for debugging).
     * @returns {string} Text representation of the board
     */
    Render() {
        let output = "   " + Array.from({length: 15}, (_, i) => String(i).padStart(2)).join(" ") + "\n";

        for (let row = 0; row < 15; row++) {
            let line = String(row).padStart(2) + " ";

            for (let col = 0; col < 15; col++) {
                if (this.blackPieces[row][col] === 1) {
                    line += " x";
                } else if (this.whitePieces[row][col] === 1) {
                    line += " o";
                } else {
                    line += " .";
                }
            }

            output += line + "\n";
        }

        return output;
    }
}

    <script>
/**
 * AI Player Module using ONNX Runtime Web
 *
 * Loads and runs the Gomoku policy network in the browser.
 */

class OnnxAIPlayer {
    constructor(modelPath) {
        this.modelPath = modelPath;
        this.session = null;
    }

    /**
     * Load the ONNX model.
     * @returns {Promise<void>}
     */
    async loadModel() {
        console.log(`Loading model from: ${this.modelPath}`);

        const options = {
            executionProviders: ['wasm'],
            graphOptimizationLevel: 'all'
        };

        this.session = await ort.InferenceSession.create(this.modelPath, options);

        console.log('Model loaded successfully');
    }

    /**
     * Get AI's next move for a given board state.
     * @param {GomokuBoard} board - Current board state
     * @returns {Promise<Array>} [row, col] of AI's move
     */
    async getMove(board) {
        // Get board state from current player's perspective
        const [c0, c1, whoToPlay] = board.GetBoardState();

        // Convert to tensor [2, 15, 15] (no batch dimension)
        const inputTensor = this._boardToTensor(c0, c1);

        // Run inference
        const feeds = { board_state: inputTensor };
        const results = await this.session.run(feeds);

        // Get output probabilities [15, 15] (flattened to [225])
        const policyOutput = results.policy_probs;
        const probs = Array.from(policyOutput.data);

        console.log('Policy probs sum:', probs.reduce((a, b) => a + b, 0).toFixed(6));
        console.log(`Position value: ${results.value.data[0].toFixed(3)}`);

        // Get legal moves mask
        const [legalMask, _] = board.GetLegalMoves();
        const legalMaskFlat = this._flattenMask(legalMask);

        // Mask illegal moves and renormalize
        let maskedProbs = new Array(225);
        let sum = 0;
        for (let i = 0; i < 225; i++) {
            if (legalMaskFlat[i] === 0) {
                maskedProbs[i] = 0;
            } else {
                maskedProbs[i] = probs[i];
                sum += probs[i];
            }
        }

        // Renormalize to sum to 1.0
        for (let i = 0; i < 225; i++) {
            maskedProbs[i] /= sum;
        }

        // Sample from probability distribution (temperature is baked into model)
        const actionIdx = this._sampleCategorical(maskedProbs);

        // Convert flat index to (row, col)
        const row = Math.floor(actionIdx / 15);
        const col = actionIdx % 15;

        return [row, col];
    }

    /**
     * Convert board state to ONNX tensor.
     * @param {Array} c0 - Current player's pieces [15][15]
     * @param {Array} c1 - Opponent's pieces [15][15]
     * @returns {ort.Tensor} Input tensor [2, 15, 15] (no batch dimension)
     */
    _boardToTensor(c0, c1) {
        const data = new Float32Array(450);

        // Fill channel 0 (current player)
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                data[i * 15 + j] = c0[i][j];
            }
        }

        // Fill channel 1 (opponent)
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                data[225 + i * 15 + j] = c1[i][j];
            }
        }

        return new ort.Tensor('float32', data, [2, 15, 15]);
    }

    /**
     * Flatten 2D legal mask to 1D array.
     * @param {Array} mask - 15x15 legal moves mask
     * @returns {Array} Flattened 225-element array
     */
    _flattenMask(mask) {
        const flat = new Array(225);
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                flat[i * 15 + j] = mask[i][j];
            }
        }
        return flat;
    }

    /**
     * Sample from categorical distribution.
     * @param {Array} probs - Probability distribution (must sum to 1)
     * @returns {number} Sampled index
     */
    _sampleCategorical(probs) {
        const rand = Math.random();
        let cumsum = 0;

        for (let i = 0; i < probs.length; i++) {
            cumsum += probs[i];
            if (rand <= cumsum) {
                return i;
            }
        }

        return probs.length - 1;
    }
}

/**
 * Model Manager
 *
 * Handles model selection and loading.
 */

class ModelManager {
    constructor() {
        this.models = {
            junior: {
                path: 'models/easy.onnx',
                size: '~14 MB',
                description: '初级',
                params: '355万参数',
                training: '20480轮对弈 (温度1.0)',
                sizeBytes: 14 * 1024 * 1024
            },
            intermediate: {
                path: 'models/mid.onnx',
                size: '~14 MB',
                description: '中级',
                params: '355万参数',
                training: '20480轮对弈 (温度0.5)',
                sizeBytes: 14 * 1024 * 1024
            },
            advanced: {
                path: 'models/hard.onnx',
                size: '~14 MB',
                description: '高级',
                params: '355万参数',
                training: '20480轮对弈 (温度0.2)',
                sizeBytes: 14 * 1024 * 1024
            }
        };

        this.selectedModel = null;
    }

    /**
     * Initialize model manager.
     */
    async initialize() {
        console.log('Model Manager initialized');
    }

    /**
     * Set selected model.
     * @param {string} modelType - 'junior', 'intermediate', or 'advanced'
     */
    setSelectedModel(modelType) {
        this.selectedModel = modelType;
    }

    /**
     * Get selected model path.
     * @returns {string} Path to ONNX model file
     */
    getModelPath() {
        return this.models[this.selectedModel].path;
    }

    /**
     * Load selected model.
     * @returns {Promise<OnnxAIPlayer>} Loaded AI player
     */
    async loadSelectedModel() {
        const modelPath = this.getModelPath();
        const aiPlayer = new OnnxAIPlayer(modelPath);
        await aiPlayer.loadModel();
        return aiPlayer;
    }
}

    <script>
/**
 * Main Game Controller
 *
 * Orchestrates the UI, game flow, and AI interaction.
 */

// ============================================================================
// Global State
// ============================================================================

const gameState = {
    board: null,
    aiPlayer: null,
    modelManager: null,
    playerColor: Player.BLACK, // User's color
    aiColor: Player.WHITE,
    history: [],  // History of moves for undo
    isAIThinking: false,
    pendingMove: null,  // {row, col} for move confirmation
    lastAIThinkTime: 0  // Last AI thinking time in seconds
};

// ============================================================================
// DOM Elements
// ============================================================================

const loadingScreen = document.getElementById('loading-screen');
const setupPanel = document.getElementById('setup-panel');
const gamePanel = document.getElementById('game-panel');
const resultModal = document.getElementById('result-modal');

const canvas = document.getElementById('game-board');
const ctx = canvas.getContext('2d');

// ============================================================================
// Initialization
// ============================================================================

/**
 * Initialize the game on page load.
 */
async function init() {
    console.log('Initializing Gomoku game...');

    // Show setup panel
    setupPanel.style.display = 'block';

    // Initialize model manager
    gameState.modelManager = new ModelManager();
    await gameState.modelManager.initialize();

    // Set up event listeners
    setupEventListeners();

    console.log('Initialization complete');
}

/**
 * Set up all event listeners.
 */
function setupEventListeners() {
    // Color selection
    document.querySelectorAll('.btn-color').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Difficulty selection
    document.querySelectorAll('.btn-difficulty').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-difficulty').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Start game button
    document.getElementById('btn-start').addEventListener('click', startGame);

    // Game controls
    document.getElementById('btn-undo').addEventListener('click', undoMove);
    document.getElementById('btn-restart').addEventListener('click', restartGame);

    // Board click
    canvas.addEventListener('click', handleBoardClick);

    // Move confirmation
    document.getElementById('btn-confirm-move').addEventListener('click', confirmMove);
    document.getElementById('btn-cancel-move').addEventListener('click', cancelMove);

    // Result modal
    document.getElementById('btn-play-again').addEventListener('click', playAgain);
    document.getElementById('btn-new-setup').addEventListener('click', newSetup);

    // Window resize
    window.addEventListener('resize', updateCanvasSize);
}

// ============================================================================
// Game Flow
// ============================================================================

/**
 * Start a new game with selected settings.
 */
async function startGame() {
    console.log('Starting game...');

    // Get selected color
    const colorBtn = document.querySelector('.btn-color.active');
    gameState.playerColor = parseInt(colorBtn.dataset.color);
    gameState.aiColor = (gameState.playerColor === Player.BLACK) ? Player.WHITE : Player.BLACK;

    // Get selected difficulty
    const difficultyBtn = document.querySelector('.btn-difficulty.active');
    const difficulty = difficultyBtn.dataset.difficulty;
    gameState.modelManager.setSelectedModel(difficulty);

    console.log(`  Player color: ${gameState.playerColor === Player.BLACK ? 'Black' : 'White'}`);
    console.log(`  AI color: ${gameState.aiColor === Player.BLACK ? 'Black' : 'White'}`);
    console.log(`  Difficulty: ${difficulty}`);

    // Show loading screen
    setupPanel.style.display = 'none';
    loadingScreen.style.display = 'block';

    // Start orbital animation
    startOrbitAnimation();

    try {
        // Load model
        gameState.aiPlayer = await gameState.modelManager.loadSelectedModel();

        // Stop orbital animation
        stopOrbitAnimation();

        // Initialize board
        gameState.board = new GomokuBoard();
        gameState.history = [];
        gameState.isAIThinking = false;
        gameState.pendingMove = null;

        // Show game panel
        loadingScreen.style.display = 'none';
        gamePanel.style.display = 'block';

        // Initialize canvas
        updateCanvasSize();
        drawBoard();

        // If AI plays first (black), make AI move
        if (gameState.aiColor === Player.BLACK) {
            await makeAIMove();
        } else {
            updateStatus('你的回合');
        }

    } catch (error) {
        console.error('Failed to start game:', error);
        alert('加载模型失败,请刷新页面重试。');
        loadingScreen.style.display = 'none';
        setupPanel.style.display = 'block';
    }
}

/**
 * Restart game with same settings.
 */
async function restartGame() {
    console.log('Restarting game...');

    // Show setup panel
    gamePanel.style.display = 'none';
    setupPanel.style.display = 'block';
}

/**
 * Play again (after game ends).
 */
function playAgain() {
    resultModal.style.display = 'none';

    // Reset board
    gameState.board = new GomokuBoard();
    gameState.history = [];
    gameState.isAIThinking = false;
    gameState.pendingMove = null;

    drawBoard();

    // If AI plays first, make AI move
    if (gameState.aiColor === Player.BLACK) {
        makeAIMove();
    } else {
        updateStatus('你的回合');
    }
}

/**
 * New setup (return to setup panel).
 */
function newSetup() {
    resultModal.style.display = 'none';
    gamePanel.style.display = 'none';
    setupPanel.style.display = 'block';
}

// ============================================================================
// Move Handling
// ============================================================================

/**
 * Handle board click.
 */
function handleBoardClick(event) {
    if (gameState.isAIThinking) return;
    if (gameState.pendingMove) return; // Already have a pending move
    if (gameState.board.whoToPlay !== gameState.playerColor) return;

    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    // Convert to board coordinates
    const pos = screenToBoard(x, y);
    if (!pos) return;

    const [row, col] = pos;

    // Show pending move
    gameState.pendingMove = { row, col };
    drawBoard();

    // Show confirmation buttons
    document.getElementById('move-confirm').classList.add('visible');
}

/**
 * Confirm pending move.
 */
async function confirmMove() {
    if (!gameState.pendingMove) return;

    const { row, col } = gameState.pendingMove;

    // Hide confirmation buttons
    document.getElementById('move-confirm').classList.remove('visible');

    // Make move
    await makePlayerMove(row, col);

    gameState.pendingMove = null;
}

/**
 * Cancel pending move.
 */
function cancelMove() {
    gameState.pendingMove = null;
    document.getElementById('move-confirm').classList.remove('visible');
    drawBoard();
}

/**
 * Make a player move.
 */
async function makePlayerMove(row, col) {
    console.log(`Player move: (${row}, ${col})`);

    // Save to history
    gameState.history.push({
        row, col,
        player: gameState.playerColor,
        blackPieces: gameState.board.blackPieces.map(r => [...r]),
        whitePieces: gameState.board.whitePieces.map(r => [...r]),
        whoToPlay: gameState.board.whoToPlay,
        occupiedCount: gameState.board.occupiedCount
    });

    // Make move
    const result = gameState.board.Move(row, col);

    drawBoard();

    // Check game result
    if (result !== GameState.CONTINUE) {
        handleGameEnd(result);
        return;
    }

    // AI's turn
    await makeAIMove();
}

/**
 * Make an AI move.
 */
async function makeAIMove() {
    gameState.isAIThinking = true;
    updateStatus('AI思考中...');

    try {
        // Get AI move (samples from probability distribution, temperature is baked into model)
        const startTime = performance.now();
        const [aiRow, aiCol] = await gameState.aiPlayer.getMove(gameState.board);
        const endTime = performance.now();

        gameState.lastAIThinkTime = (endTime - startTime) / 1000; // Convert to seconds

        console.log(`AI move: (${aiRow}, ${aiCol}), think time: ${gameState.lastAIThinkTime.toFixed(2)}s`);

        // Save to history
        gameState.history.push({
            row: aiRow, col: aiCol,
            player: gameState.aiColor,
            blackPieces: gameState.board.blackPieces.map(r => [...r]),
            whitePieces: gameState.board.whitePieces.map(r => [...r]),
            whoToPlay: gameState.board.whoToPlay,
            occupiedCount: gameState.board.occupiedCount
        });

        // Make move
        const result = gameState.board.Move(aiRow, aiCol);

        drawBoard();

        gameState.isAIThinking = false;

        // Check game result
        if (result !== GameState.CONTINUE) {
            handleGameEnd(result);
            return;
        }

        // Player's turn
        updateStatus(`你的回合 (AI思考: ${gameState.lastAIThinkTime.toFixed(2)}秒)`);

    } catch (error) {
        console.error('AI move failed:', error);
        gameState.isAIThinking = false;
        updateStatus('AI出错,请重新开始');
    }
}

/**
 * Undo last move (player + AI).
 */
function undoMove() {
    if (gameState.history.length === 0) return;
    if (gameState.isAIThinking) return;
    if (gameState.pendingMove) return;

    // Pop the last 2 moves (AI + player), or as many as available
    // Since we save state BEFORE making a move, we need to pop twice
    const movesToUndo = Math.min(2, gameState.history.length);
    for (let i = 0; i < movesToUndo; i++) {
        gameState.history.pop();
    }

    // Restore board state
    if (gameState.history.length > 0) {
        // Restore to the last saved state
        const lastState = gameState.history[gameState.history.length - 1];
        gameState.board.blackPieces = lastState.blackPieces.map(r => [...r]);
        gameState.board.whitePieces = lastState.whitePieces.map(r => [...r]);
        gameState.board.whoToPlay = lastState.whoToPlay;
        gameState.board.occupiedCount = lastState.occupiedCount;
    } else {
        // No history left, reset to initial state
        gameState.board = new GomokuBoard();
    }

    drawBoard();
    updateStatus('你的回合');
}

/**
 * Handle game end.
 */
function handleGameEnd(result) {
    console.log(`Game ended: ${result}`);

    let title = '游戏结束';
    let message = '';

    if (result === GameState.BLACK_WIN) {
        title = gameState.playerColor === Player.BLACK ? '你赢了！' : '你输了！';
        message = '⚫ 黑棋获胜';
    } else if (result === GameState.WHITE_WIN) {
        title = gameState.playerColor === Player.WHITE ? '你赢了！' : '你输了！';
        message = '⚪ 白棋获胜';
    } else if (result === GameState.DRAW) {
        title = '平局';
        message = '棋盘已满,没有获胜者';
    }

    document.getElementById('result-title').textContent = title;
    document.getElementById('result-message').textContent = message;
    resultModal.style.display = 'flex';
}

// ============================================================================
// Drawing
// ============================================================================

/**
 * Update canvas size (responsive).
 */
function updateCanvasSize() {
    const container = document.querySelector('.board-container');
    const containerWidth = container.clientWidth;

    // Limit to 600px max
    const maxSize = Math.min(containerWidth, 600);

    // Apply device pixel ratio for high-DPI displays
    const dpr = window.devicePixelRatio || 1;

    // Set CSS size (display size)
    canvas.style.width = maxSize + 'px';
    canvas.style.height = maxSize + 'px';

    // Set internal resolution (physical pixels)
    canvas.width = maxSize * dpr;
    canvas.height = maxSize * dpr;

    // Scale context to match DPR
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    drawBoard();
}

/**
 * Draw the game board.
 */
function drawBoard() {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width;
    const padding = size * 0.05;
    const gridSize = (size - 2 * padding) / 14;

    // Clear canvas
    ctx.fillStyle = '#F8F8F8';
    ctx.fillRect(0, 0, size, size);

    // Draw grid
    ctx.strokeStyle = '#808080';
    ctx.lineWidth = 1;

    for (let i = 0; i < 15; i++) {
        // Vertical lines
        ctx.beginPath();
        ctx.moveTo(padding + i * gridSize, padding);
        ctx.lineTo(padding + i * gridSize, padding + 14 * gridSize);
        ctx.stroke();

        // Horizontal lines
        ctx.beginPath();
        ctx.moveTo(padding, padding + i * gridSize);
        ctx.lineTo(padding + 14 * gridSize, padding + i * gridSize);
        ctx.stroke();
    }

    // Draw star points
    ctx.fillStyle = '#404040';
    const starPoints = [
        [3, 3], [3, 11], [11, 3], [11, 11], [7, 7]
    ];

    for (const [row, col] of starPoints) {
        const x = padding + col * gridSize;
        const y = padding + row * gridSize;
        ctx.beginPath();
        ctx.arc(x, y, size * 0.008, 0, 2 * Math.PI);
        ctx.fill();
    }

    // Draw pieces
    const pieceRadius = gridSize * 0.4;

    for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
            const x = padding + col * gridSize;
            const y = padding + row * gridSize;

            if (gameState.board.blackPieces[row][col] === 1) {
                // Black piece
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
                ctx.fill();
            } else if (gameState.board.whitePieces[row][col] === 1) {
                // White piece
                ctx.fillStyle = '#FFF';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
            }
        }
    }

    // Draw pending move (semi-transparent)
    if (gameState.pendingMove) {
        const { row, col } = gameState.pendingMove;
        const x = padding + col * gridSize;
        const y = padding + row * gridSize;

        const color = gameState.playerColor === Player.BLACK ? '#000' : '#FFF';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
        ctx.fill();

        if (gameState.playerColor === Player.WHITE) {
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        ctx.globalAlpha = 1.0;
    }
}

/**
 * Convert screen coordinates to board position.
 */
function screenToBoard(x, y) {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width;
    const padding = size * 0.05;
    const gridSize = (size - 2 * padding) / 14;

    const col = Math.round((x - padding) / gridSize);
    const row = Math.round((y - padding) / gridSize);

    if (row < 0 || row >= 15 || col < 0 || col >= 15) {
        return null;
    }

    return [row, col];
}

/**
 * Update status text.
 */
function updateStatus(text) {
    document.getElementById('status-text').textContent = text;
}

// ============================================================================
// Orbital Loading Animation
// ============================================================================

let orbitAnimationRunning = false;
let orbitAnimationFrame = null;
let orbitLines = [];

/**
 * Start the orbital animation.
 */
function startOrbitAnimation() {
    orbitAnimationRunning = true;

    // Clean up any existing lines
    cleanupOrbitLines();

    const svg = document.querySelector('.loading-orbit svg');
    const orbitLinesContainer = document.getElementById('orbit-lines');

    // Get planet elements
    const planet1 = document.querySelector('.planet-1');
    const planet2 = document.querySelector('.planet-2');
    const planet3 = document.querySelector('.planet-3');

    // Create lines (3 lines connecting the planets in a triangle)
    for (let i = 0; i < 3; i++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', '#999');
        line.setAttribute('stroke-width', '1');
        orbitLinesContainer.appendChild(line);
        orbitLines.push(line);
    }

    // Animation function
    function animate() {
        if (!orbitAnimationRunning) return;

        // Get planet positions
        const pos1 = getPlanetPosition(planet1);
        const pos2 = getPlanetPosition(planet2);
        const pos3 = getPlanetPosition(planet3);

        // Update lines
        // Line 0: planet1 -> planet2
        orbitLines[0].setAttribute('x1', pos1.x);
        orbitLines[0].setAttribute('y1', pos1.y);
        orbitLines[0].setAttribute('x2', pos2.x);
        orbitLines[0].setAttribute('y2', pos2.y);

        // Line 1: planet2 -> planet3
        orbitLines[1].setAttribute('x1', pos2.x);
        orbitLines[1].setAttribute('y1', pos2.y);
        orbitLines[1].setAttribute('x2', pos3.x);
        orbitLines[1].setAttribute('y2', pos3.y);

        // Line 2: planet3 -> planet1
        orbitLines[2].setAttribute('x1', pos3.x);
        orbitLines[2].setAttribute('y1', pos3.y);
        orbitLines[2].setAttribute('x2', pos1.x);
        orbitLines[2].setAttribute('y2', pos1.y);

        orbitAnimationFrame = requestAnimationFrame(animate);
    }

    animate();
}

/**
 * Stop the orbital animation.
 */
function stopOrbitAnimation() {
    orbitAnimationRunning = false;
    if (orbitAnimationFrame) {
        cancelAnimationFrame(orbitAnimationFrame);
        orbitAnimationFrame = null;
    }
    cleanupOrbitLines();
}

/**
 * Clean up orbit lines from DOM.
 */
function cleanupOrbitLines() {
    orbitLines.forEach(line => line.parentNode.removeChild(line));
    orbitLines = [];
}

/**
 * Get planet position in SVG coordinates.
 */
function getPlanetPosition(planet) {
    const svg = planet.ownerSVGElement;
    const ctm = planet.getCTM();

    return {
        x: ctm.e,
        y: ctm.f
    };
}

// ============================================================================
// Start
// ============================================================================

init();

    </script>
