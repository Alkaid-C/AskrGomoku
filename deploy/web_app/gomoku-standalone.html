<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Askr五子棋</title>
    <style>
/* 极简风格 CSS */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
    background: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    color: #333;
}

h1 {
    font-size: 2em;
    font-weight: 400;
    text-align: center;
    margin-bottom: 40px;
    color: #333;
}

/* ============================================================================
   Loading Screen
   ============================================================================ */

#loading-screen {
    text-align: center;
    max-width: 400px;
    width: 100%;
}

/* Loading Orbit Animation */
.loading-orbit {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 40px 0;
    min-height: 200px;
}

.loading-orbit svg {
    display: block;
}

#loading-message {
    font-size: 0.9em;
    color: #999;
}

/* ============================================================================
   Setup Panel
   ============================================================================ */

#setup-panel {
    text-align: center;
    max-width: 400px;
    width: 100%;
}

.setup-content {
    margin-top: 20px;
}

.setup-content label {
    display: block;
    font-size: 1em;
    color: #666;
    margin-bottom: 20px;
}

.button-group {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
}

.btn-color {
    flex: 1;
    padding: 12px 20px;
    font-size: 1em;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #333;
}

.btn-color:hover {
    border-color: #999;
}

.btn-color.active {
    border-color: #333;
    background: #333;
    color: white;
}

/* Difficulty Selection */
.difficulty-group {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
}

.btn-difficulty {
    flex: 1;
    padding: 15px 10px;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
}

.btn-difficulty:hover {
    border-color: #999;
}

.btn-difficulty.active {
    border-color: #333;
    background: #333;
    color: white;
}

.difficulty-name {
    font-family: 'Times New Roman', serif;
    font-size: 1.3em;
    font-style: italic;
    font-weight: normal;
    margin-bottom: 8px;
}

.difficulty-info {
    font-size: 0.75em;
    color: #999;
    line-height: 1.4;
}

.btn-difficulty.active .difficulty-info {
    color: #ccc;
}

.btn-primary {
    width: 100%;
    padding: 12px 30px;
    font-size: 1em;
    color: white;
    background: #333;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease;
}

.btn-primary:hover {
    background: #555;
}

.btn-primary:active {
    background: #222;
}

/* ============================================================================
   Game Panel
   ============================================================================ */

#game-panel {
    max-width: 700px;
    width: 100%;
}

/* Top Controls */
.top-controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 30px;
    gap: 10px 20px;
}

#btn-undo, #end-stat-left {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
}

#status-text {
    grid-column: 2;
    grid-row: 1;
    font-size: 1.1em;
    color: #333;
    text-align: center;
}

#btn-restart, #end-stat-right {
    grid-column: 3;
    grid-row: 1;
    justify-self: end;
}

#end-stat-right {
    text-align: right;
}

.btn-control {
    padding: 8px 20px;
    font-size: 0.9em;
    color: #666;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-control:hover {
    border-color: #999;
    color: #333;
}

.btn-control:active {
    background: #f5f5f5;
}

/* Board Container */
.board-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

#game-board {
    display: block;
    max-width: 100%;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

/* Move Confirmation */
.move-confirm {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
    visibility: hidden;
    min-height: 44px; /* 预留按钮高度，防止布局跳动 */
}

.move-confirm.visible {
    visibility: visible;
}

.btn-confirm,
.btn-cancel {
    padding: 10px 30px;
    font-size: 1em;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s ease;
    color: white;
    /* Prevent iOS scroll jump on tap */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.btn-confirm {
    background: #333;
}

.btn-confirm:hover {
    opacity: 0.8;
}

.btn-cancel {
    background: #999;
}

.btn-cancel:hover {
    opacity: 0.8;
}

/* End Stats (shown in top-controls when game ends, replacing buttons) */
.end-stat {
    display: none;
    font-size: 0.85em;
    color: #666;
    line-height: 1.25;
}

.end-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
    min-height: 44px;
}

/* ============================================================================
   Modal
   ============================================================================ */

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    text-align: center;
    max-width: 400px;
    width: 100%;
    padding: 20px;
}

.modal-content h2 {
    font-size: 1.8em;
    font-weight: 400;
    margin-bottom: 20px;
    color: #333;
}

.modal-content p {
    font-size: 1em;
    margin-bottom: 40px;
    color: #666;
}

/* Result Stats */
.result-stats {
    font-size: 0.9em;
    color: #999;
    margin-bottom: 30px;
}

/* Share Button */
.btn-share {
    width: 100%;
    padding: 12px 30px;
    font-size: 1em;
    color: #333;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 10px;
}

.btn-share:hover {
    border-color: #999;
}

.btn-share:active {
    background: #f5f5f5;
}

.btn-secondary {
    width: 100%;
    padding: 12px 30px;
    font-size: 1em;
    color: #666;
    background: white;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 10px;
}

.btn-secondary:hover {
    border-color: #999;
    color: #333;
}

/* ============================================================================
   Record Screen
   ============================================================================ */

.record-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #F8F8F8;
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.btn-record-close {
    position: absolute;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    font-size: 1.8em;
    color: #999;
    cursor: pointer;
    line-height: 1;
    padding: 5px 10px;
    transition: color 0.2s ease;
    z-index: 2001;
}

.btn-record-close:hover {
    color: #333;
}

.record-content {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.record-title {
    font-size: 1.5em;
    font-weight: 400;
    color: #333;
    text-align: center;
    margin-bottom: 12px;
}

.record-info {
    width: 100%;
    margin-bottom: 10px;
}

.record-info-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85em;
    color: #666;
    line-height: 1.8;
}

.record-piece {
    display: inline-block;
    width: 0.8em;
    height: 0.8em;
    border-radius: 50%;
    vertical-align: middle;
    position: relative;
    top: -0.05em;
}

.record-piece-black {
    background: #222;
}

.record-piece-white {
    background: #eee;
    box-shadow: inset 0 0 0 1.5px #000;
}

.record-board-container {
    display: flex;
    justify-content: center;
    align-items: center;
}

#record-board {
    display: block;
    max-width: 100%;
}

.record-footer {
    font-size: 0.85em;
    color: #999;
    text-align: center;
    margin-top: 10px;
}

/* ============================================================================
   Credit
   ============================================================================ */

.credit {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 0.85em;
    color: #666;
}

.credit a {
    color: #666;
    text-decoration: none;
    transition: color 0.2s ease;
}

.credit a:hover {
    color: #333;
}

/* Privacy Note */
.privacy-note {
    font-size: 0.75em;
    color: #aaa;
    text-align: center;
    margin-top: 20px;
    line-height: 1.4;
}

/* ============================================================================
   Mobile Responsiveness
   ============================================================================ */

@media (max-width: 768px) {
    body {
        padding: 20px 15px;
    }

    h1 {
        font-size: 1.5em;
        margin-bottom: 30px;
    }

    .top-controls {
        margin-bottom: 20px;
        gap: 10px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 10px 10px;
    }

    h1 {
        font-size: 1.3em;
        margin-bottom: 20px;
    }

    /* 黑白棋选择保持横排 */
    .button-group {
        gap: 8px;
    }

    .btn-color {
        font-size: 0.9em;
        padding: 10px 12px;
    }

    /* 难度选择按钮竖排 */
    .difficulty-group {
        flex-direction: column;
        gap: 10px;
    }

    /* 按钮内部改为横排：左边名字，右边信息 */
    .btn-difficulty {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        text-align: left;
    }

    .difficulty-name {
        flex-shrink: 0;
        min-width: 4em;
        margin-bottom: 0;
        margin-right: 0;
        font-size: 1.2em;
    }

    .difficulty-info {
        text-align: center;
        font-size: 0.65em;
        line-height: 1.3;
    }

    .difficulty-info:nth-of-type(2) {
        min-width: 2.5em;
    }

    .difficulty-info:nth-of-type(3) {
        min-width: 6em;
        text-align: right;
    }

    .btn-control {
        font-size: 0.85em;
        padding: 8px 15px;
    }
}

    <script>
/**
 * Gomoku Game Logic (JavaScript port of gomoku_board.py)
 *
 * Implements the game board and rules for Gomoku (Five-in-a-Row).
 */

// Game state constants
const GameState = {
    CONTINUE: 0,
    BLACK_WIN: 1,
    WHITE_WIN: 2,
    DRAW: 3
};

// Player constants
const Player = {
    BLACK: 1,
    WHITE: 2
};

/**
 * Gomoku Board Class
 * Manages a 15x15 board with piece placement and win detection.
 */
class GomokuBoard {
    constructor() {
        // Initialize 15x15 board
        this.blackPieces = Array(15).fill(null).map(() => Array(15).fill(0));
        this.whitePieces = Array(15).fill(null).map(() => Array(15).fill(0));
        this.whoToPlay = Player.BLACK;
        this.occupiedCount = 0;
    }

    /**
     * Make a move on the board.
     * @param {number} row - Row index (0-14)
     * @param {number} col - Column index (0-14)
     * @returns {number} GameState indicating the result
     */
    Move(row, col) {
        // Place piece
        if (this.whoToPlay === Player.BLACK) {
            this.blackPieces[row][col] = 1;
        } else {
            this.whitePieces[row][col] = 1;
        }

        this.occupiedCount++;

        // Check for win
        if (this._checkWin(this.whoToPlay, row, col)) {
            return this.whoToPlay === Player.BLACK ? GameState.BLACK_WIN : GameState.WHITE_WIN;
        }

        // Check for draw (board full)
        if (this.occupiedCount === 225) {
            return GameState.DRAW;
        }

        // Switch players
        this.whoToPlay = (this.whoToPlay === Player.BLACK) ? Player.WHITE : Player.BLACK;

        return GameState.CONTINUE;
    }

    /**
     * Check if the current move resulted in a win.
     * @param {number} player - Player who just moved
     * @param {number} row - Row of the last move
     * @param {number} col - Column of the last move
     * @returns {boolean} True if player won
     */
    _checkWin(player, row, col) {
        const pieces = (player === Player.BLACK) ? this.blackPieces : this.whitePieces;

        // Four directions to check: horizontal, vertical, diagonal, anti-diagonal
        const directions = [
            [0, 1],   // Horizontal
            [1, 0],   // Vertical
            [1, 1],   // Diagonal (\)
            [1, -1]   // Anti-diagonal (/)
        ];

        for (const [dr, dc] of directions) {
            let count = 1; // Count the placed stone itself

            // Count in positive direction
            let r = row + dr;
            let c = col + dc;
            while (r >= 0 && r < 15 && c >= 0 && c < 15 && pieces[r][c] === 1) {
                count++;
                r += dr;
                c += dc;
            }

            // Count in negative direction
            r = row - dr;
            c = col - dc;
            while (r >= 0 && r < 15 && c >= 0 && c < 15 && pieces[r][c] === 1) {
                count++;
                r -= dr;
                c -= dc;
            }

            if (count >= 5) {
                return true;
            }
        }

        return false;
    }

    /**
     * Get legal moves mask.
     * @returns {Array} [legalMask, nextPlayer] where legalMask is 15x15 array
     */
    GetLegalMoves() {
        const legalMask = Array(15).fill(null).map(() => Array(15).fill(0));

        for (let row = 0; row < 15; row++) {
            for (let col = 0; col < 15; col++) {
                if (this.blackPieces[row][col] === 0 && this.whitePieces[row][col] === 0) {
                    legalMask[row][col] = 1;
                }
            }
        }

        return [legalMask, this.whoToPlay];
    }

    /**
     * Get board state for neural network input.
     * Returns perspective of current player (current player's pieces as c0).
     * @returns {Array} [c0, c1, whoToPlay] where c0 is current player, c1 is opponent
     */
    GetBoardState() {
        let c0, c1;

        if (this.whoToPlay === Player.BLACK) {
            c0 = this.blackPieces.map(row => [...row]); // Deep copy
            c1 = this.whitePieces.map(row => [...row]);
        } else {
            c0 = this.whitePieces.map(row => [...row]);
            c1 = this.blackPieces.map(row => [...row]);
        }

        return [c0, c1, this.whoToPlay];
    }

    /**
     * Create a deep copy of the board.
     * @returns {GomokuBoard} Cloned board instance
     */
    clone() {
        const copy = new GomokuBoard();
        copy.blackPieces = this.blackPieces.map(row => [...row]);
        copy.whitePieces = this.whitePieces.map(row => [...row]);
        copy.whoToPlay = this.whoToPlay;
        copy.occupiedCount = this.occupiedCount;
        return copy;
    }

    /**
     * Render board as text (for debugging).
     * @returns {string} Text representation of the board
     */
    Render() {
        let output = "   " + Array.from({length: 15}, (_, i) => String(i).padStart(2)).join(" ") + "\n";

        for (let row = 0; row < 15; row++) {
            let line = String(row).padStart(2) + " ";

            for (let col = 0; col < 15; col++) {
                if (this.blackPieces[row][col] === 1) {
                    line += " x";
                } else if (this.whitePieces[row][col] === 1) {
                    line += " o";
                } else {
                    line += " .";
                }
            }

            output += line + "\n";
        }

        return output;
    }
}

    <script>
/**
 * AI Player Module using ONNX Runtime Web
 *
 * Loads and runs the Gomoku policy network in the browser.
 */

class OnnxAIPlayer {
    constructor(modelPath) {
        this.modelPath = modelPath;
        this.session = null;
    }

    /**
     * Load the ONNX model.
     * @returns {Promise<void>}
     */
    async loadModel() {
        console.log(`Loading model from: ${this.modelPath}`);

        const options = {
            executionProviders: ['wasm'],
            graphOptimizationLevel: 'all'
        };

        this.session = await ort.InferenceSession.create(this.modelPath, options);

        console.log('Model loaded successfully');
    }

    /**
     * Get AI's next move for a given board state.
     * @param {GomokuBoard} board - Current board state
     * @returns {Promise<Array>} [row, col] of AI's move
     */
    async getMove(board) {
        // Get board state from current player's perspective
        const [c0, c1] = board.GetBoardState();

        // Convert to tensor [2, 15, 15] (no batch dimension)
        const inputTensor = this._boardToTensor(c0, c1);

        // Run inference
        const feeds = { board_state: inputTensor };
        const results = await this.session.run(feeds);

        // Get output probabilities [15, 15] (flattened to [225])
        const policyOutput = results.policy_probs;
        const probs = Array.from(policyOutput.data);

        console.log('Policy probs sum:', probs.reduce((a, b) => a + b, 0).toFixed(6));
        console.log(`Position value: ${results.value.data[0].toFixed(3)}`);

        // Get legal moves mask
        const [legalMask, _] = board.GetLegalMoves();
        const legalMaskFlat = this._flattenMask(legalMask);

        // Mask illegal moves and renormalize
        let maskedProbs = new Array(225);
        let sum = 0;
        for (let i = 0; i < 225; i++) {
            if (legalMaskFlat[i] === 0) {
                maskedProbs[i] = 0;
            } else {
                maskedProbs[i] = probs[i];
                sum += probs[i];
            }
        }

        // Renormalize to sum to 1.0
        for (let i = 0; i < 225; i++) {
            maskedProbs[i] /= sum;
        }

        // Sample from probability distribution (temperature is baked into model)
        const actionIdx = this._sampleCategorical(maskedProbs);

        // Convert flat index to (row, col)
        const row = Math.floor(actionIdx / 15);
        const col = actionIdx % 15;

        return [row, col, results.value.data[0]];
    }

    /**
     * Convert board state to ONNX tensor.
     * @param {Array} c0 - Current player's pieces [15][15]
     * @param {Array} c1 - Opponent's pieces [15][15]
     * @returns {ort.Tensor} Input tensor [2, 15, 15] (no batch dimension)
     */
    _boardToTensor(c0, c1) {
        const data = new Float32Array(450);

        // Fill channel 0 (current player)
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                data[i * 15 + j] = c0[i][j];
            }
        }

        // Fill channel 1 (opponent)
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                data[225 + i * 15 + j] = c1[i][j];
            }
        }

        return new ort.Tensor('float32', data, [2, 15, 15]);
    }

    /**
     * Flatten 2D legal mask to 1D array.
     * @param {Array} mask - 15x15 legal moves mask
     * @returns {Array} Flattened 225-element array
     */
    _flattenMask(mask) {
        const flat = new Array(225);
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                flat[i * 15 + j] = mask[i][j];
            }
        }
        return flat;
    }

    /**
     * Sample from categorical distribution.
     * @param {Array} probs - Probability distribution (must sum to 1)
     * @returns {number} Sampled index
     */
    _sampleCategorical(probs) {
        const rand = Math.random();
        let cumsum = 0;

        for (let i = 0; i < probs.length; i++) {
            cumsum += probs[i];
            if (rand <= cumsum) {
                return i;
            }
        }

        return probs.length - 1;
    }

    // ========================================================================
    // Negamax Search Methods
    // ========================================================================

    /**
     * Get AI's next move using negamax search.
     * @param {GomokuBoard} board - Current board state
     * @param {number} depth - Search depth (default 3)
     * @param {number} topK - Number of top candidates to consider (default 3)
     * @returns {Promise<Array>} [row, col] of AI's move
     */
    async getMoveWithNegamax(board, depth = 3, topK = 3) {
        console.log(`Starting negamax search: depth=${depth}, topK=${topK}`);

        // Get top-k candidates at root
        const candidates = await this._getTopKActions(board, topK);

        if (candidates.length === 0) {
            console.error('No legal moves available');
            return [7, 7]; // Fallback to center
        }

        if (candidates.length === 1) {
            // Only one legal move
            return [candidates[0].row, candidates[0].col];
        }

        // Evaluate each candidate with negamax
        let bestAction = candidates[0];
        let bestQ = -Infinity;
        let nodeCount = 0;

        for (const action of candidates) {
            const clonedBoard = board.clone();
            const result = clonedBoard.Move(action.row, action.col);

            let value;
            if (result !== GameState.CONTINUE) {
                // Terminal state
                value = this._getTerminalValue(result, board.whoToPlay);
                nodeCount++;
            } else {
                // Recursive search
                const searchResult = await this._negamax(clonedBoard, depth - 1, topK);
                value = -searchResult.value;
                nodeCount += searchResult.nodeCount;
            }

            console.log(`  Candidate (${action.row}, ${action.col}): Q = ${value.toFixed(4)}`);

            if (value > bestQ) {
                bestQ = value;
                bestAction = action;
            }
        }

        console.log(`Negamax complete: ${nodeCount} nodes evaluated`);
        console.log(`Best move: (${bestAction.row}, ${bestAction.col}) with Q = ${bestQ.toFixed(4)}`);

        return [bestAction.row, bestAction.col, bestQ];
    }

    /**
     * Recursive negamax search.
     * @param {GomokuBoard} board - Current board state
     * @param {number} depth - Remaining search depth
     * @param {number} topK - Number of candidates per node
     * @returns {Promise<Object>} {value, nodeCount}
     */
    async _negamax(board, depth, topK) {
        // Base case: leaf node - evaluate with value network
        if (depth === 0) {
            const value = await this._evaluatePosition(board);
            return { value, nodeCount: 1 };
        }

        // Get top-k candidates
        const candidates = await this._getTopKActions(board, topK);

        if (candidates.length === 0) {
            // No legal moves (shouldn't happen in Gomoku before terminal)
            const value = await this._evaluatePosition(board);
            return { value, nodeCount: 1 };
        }

        let maxValue = -Infinity;
        let totalNodeCount = 0;

        for (const action of candidates) {
            const clonedBoard = board.clone();
            const result = clonedBoard.Move(action.row, action.col);

            let value;
            if (result !== GameState.CONTINUE) {
                // Terminal state - value from current player's perspective
                value = this._getTerminalValue(result, board.whoToPlay);
                totalNodeCount++;
            } else {
                // Recursive search
                const searchResult = await this._negamax(clonedBoard, depth - 1, topK);
                value = -searchResult.value;
                totalNodeCount += searchResult.nodeCount;
            }

            if (value > maxValue) {
                maxValue = value;
            }
        }

        return { value: maxValue, nodeCount: totalNodeCount };
    }

    /**
     * Get top-k actions by policy probability.
     * @param {GomokuBoard} board - Current board state
     * @param {number} k - Number of top actions to return
     * @returns {Promise<Array>} Array of {row, col, idx, prob}
     */
    async _getTopKActions(board, k) {
        // Get board state from current player's perspective
        const [c0, c1] = board.GetBoardState();

        // Convert to tensor
        const inputTensor = this._boardToTensor(c0, c1);

        // Run inference
        const feeds = { board_state: inputTensor };
        const results = await this.session.run(feeds);

        // Get policy probabilities
        const policyOutput = results.policy_probs;
        const probs = Array.from(policyOutput.data);

        // Get legal moves mask
        const [legalMask, _] = board.GetLegalMoves();

        // Collect legal actions with their probabilities
        const legalActions = [];
        for (let row = 0; row < 15; row++) {
            for (let col = 0; col < 15; col++) {
                if (legalMask[row][col] === 1) {
                    const idx = row * 15 + col;
                    legalActions.push({
                        row,
                        col,
                        idx,
                        prob: probs[idx]
                    });
                }
            }
        }

        // Sort by probability descending
        legalActions.sort((a, b) => b.prob - a.prob);

        // Return top-k
        return legalActions.slice(0, k);
    }

    /**
     * Evaluate a position using the value network.
     * @param {GomokuBoard} board - Board state to evaluate
     * @returns {Promise<number>} Position value from current player's perspective
     */
    async _evaluatePosition(board) {
        const [c0, c1] = board.GetBoardState();
        const inputTensor = this._boardToTensor(c0, c1);

        const feeds = { board_state: inputTensor };
        const results = await this.session.run(feeds);

        // Value is from current player's perspective
        return results.value.data[0];
    }

    /**
     * Get terminal state value.
     * @param {number} result - GameState result
     * @param {number} playerAtMove - Player who was about to move (before terminal)
     * @returns {number} Value: +1 for win, -1 for loss, 0 for draw
     */
    _getTerminalValue(result, playerAtMove) {
        if (result === GameState.DRAW) {
            return 0;
        }

        // The player who just moved (not playerAtMove) caused the terminal state
        // If BLACK_WIN and playerAtMove was WHITE, then BLACK (opponent of WHITE) won
        // which means the move made by BLACK resulted in a win for BLACK

        if (result === GameState.BLACK_WIN) {
            // Black won - if playerAtMove was Black (meaning Black just moved and won)
            // then from Black's perspective this is +1
            return playerAtMove === Player.BLACK ? 1 : -1;
        } else if (result === GameState.WHITE_WIN) {
            return playerAtMove === Player.WHITE ? 1 : -1;
        }

        return 0; // Shouldn't reach here
    }
}

    <script>
/**
 * Main Game Controller
 *
 * Orchestrates the UI, game flow, and AI interaction.
 */

// ============================================================================
// Global State
// ============================================================================

const gameState = {
    board: null,
    aiPlayer: null,
    modelManager: null,
    playerColor: Player.BLACK, // User's color
    aiColor: Player.WHITE,
    history: [],  // History of moves for undo
    isAIThinking: false,
    pendingMove: null,  // {row, col} for move confirmation
    lastAIThinkTime: 0, // Last AI thinking time in seconds
    undoCount: 0,        // Number of undos in this game
    gameOver: false      // Whether the game has ended
};

// ============================================================================
// DOM Elements
// ============================================================================

const loadingScreen = document.getElementById('loading-screen');
const setupPanel = document.getElementById('setup-panel');
const gamePanel = document.getElementById('game-panel');
const resultModal = document.getElementById('result-modal');

const canvas = document.getElementById('game-board');
const ctx = canvas.getContext('2d');

// ============================================================================
// Initialization
// ============================================================================

/**
 * Initialize the game on page load.
 */
function init() {
    console.log('Initializing Gomoku game...');

    // Show setup panel
    setupPanel.style.display = 'block';

    // Initialize model manager
    gameState.modelManager = new ModelManager();
    gameState.modelManager.initialize();

    // Set up event listeners
    setupEventListeners();

    console.log('Initialization complete');
}

/**
 * Set up all event listeners.
 */
function setupEventListeners() {
    // Color selection
    document.querySelectorAll('.btn-color').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Difficulty selection
    document.querySelectorAll('.btn-difficulty').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-difficulty').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });

    // Start game button
    document.getElementById('btn-start').addEventListener('click', startGame);

    // Game controls
    document.getElementById('btn-undo').addEventListener('click', undoMove);
    document.getElementById('btn-restart').addEventListener('click', restartGame);

    // Board click
    canvas.addEventListener('click', handleBoardClick);

    // Move confirmation
    document.getElementById('btn-confirm-move').addEventListener('click', confirmMove);
    document.getElementById('btn-cancel-move').addEventListener('click', cancelMove);

    // Result modal (legacy, kept for standalone build compatibility)
    document.getElementById('btn-play-again').addEventListener('click', playAgain);
    document.getElementById('btn-new-setup').addEventListener('click', newSetup);
    document.getElementById('btn-share').addEventListener('click', showRecordScreen);
    document.getElementById('btn-record-close').addEventListener('click', hideRecordScreen);

    // End actions (in-place button after game ends)
    document.getElementById('btn-end-new-game').addEventListener('click', newSetup);

    // Window resize
    window.addEventListener('resize', updateCanvasSize);
}

// ============================================================================
// Game Flow
// ============================================================================

/**
 * Start a new game with selected settings.
 */
async function startGame() {
    console.log('Starting game...');

    // Get selected color
    const colorBtn = document.querySelector('.btn-color.active');
    gameState.playerColor = parseInt(colorBtn.dataset.color);
    gameState.aiColor = (gameState.playerColor === Player.BLACK) ? Player.WHITE : Player.BLACK;

    // Get selected difficulty
    const difficultyBtn = document.querySelector('.btn-difficulty.active');
    const difficulty = difficultyBtn.dataset.difficulty;
    gameState.modelManager.setSelectedModel(difficulty);

    console.log(`  Player color: ${gameState.playerColor === Player.BLACK ? 'Black' : 'White'}`);
    console.log(`  AI color: ${gameState.aiColor === Player.BLACK ? 'Black' : 'White'}`);
    console.log(`  Difficulty: ${difficulty}`);

    // Show loading screen
    setupPanel.style.display = 'none';
    loadingScreen.style.display = 'block';

    // Start orbital animation
    startOrbitAnimation();

    try {
        // Load model
        gameState.aiPlayer = await gameState.modelManager.loadSelectedModel();

        // Stop orbital animation
        stopOrbitAnimation();

        // Initialize board
        gameState.board = new GomokuBoard();
        gameState.history = [];
        gameState.isAIThinking = false;
        gameState.pendingMove = null;
        gameState.undoCount = 0;
        gameState.gameOver = false;

        // Reset end mode UI in case previous game ended
        resetEndModeUI();

        // Show game panel
        loadingScreen.style.display = 'none';
        gamePanel.style.display = 'block';

        // Initialize canvas
        updateCanvasSize();
        drawBoard();

        // If AI plays first (black), make AI move
        if (gameState.aiColor === Player.BLACK) {
            await makeAIMove();
        } else {
            updateStatus('你的回合');
        }

    } catch (error) {
        console.error('Failed to start game:', error);
        alert('加载模型失败,请刷新页面重试。');
        loadingScreen.style.display = 'none';
        setupPanel.style.display = 'block';
    }
}

/**
 * Restart game with same settings.
 */
function restartGame() {
    console.log('Restarting game...');

    // Show setup panel
    gamePanel.style.display = 'none';
    setupPanel.style.display = 'block';
}

/**
 * Play again (after game ends).
 */
function playAgain() {
    resultModal.style.display = 'none';
    resetEndModeUI();

    // Reset board
    gameState.board = new GomokuBoard();
    gameState.history = [];
    gameState.isAIThinking = false;
    gameState.pendingMove = null;
    gameState.undoCount = 0;
    gameState.gameOver = false;

    drawBoard();

    // If AI plays first, make AI move
    if (gameState.aiColor === Player.BLACK) {
        makeAIMove();
    } else {
        updateStatus('你的回合');
    }
}

/**
 * New setup (return to setup panel).
 */
function newSetup() {
    resultModal.style.display = 'none';
    resetEndModeUI();
    gameState.gameOver = false;
    gamePanel.style.display = 'none';
    setupPanel.style.display = 'block';
}

/**
 * Reset end mode UI back to normal game state.
 */
function resetEndModeUI() {
    // Restore top-controls: show buttons, hide stats
    document.getElementById('btn-undo').style.display = '';
    document.getElementById('btn-restart').style.display = '';
    document.getElementById('end-stat-left').style.display = 'none';
    document.getElementById('end-stat-right').style.display = 'none';

    // Restore bottom area
    document.getElementById('end-actions').style.display = 'none';
    document.getElementById('move-confirm').style.display = '';

    canvas.style.cursor = 'pointer';
}

// ============================================================================
// Move Handling
// ============================================================================

/**
 * Handle board click.
 */
function handleBoardClick(event) {
    if (gameState.gameOver) return;
    if (gameState.isAIThinking) return;
    if (gameState.board.whoToPlay !== gameState.playerColor) return;

    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    // Convert to board coordinates
    const pos = screenToBoard(x, y);
    if (!pos) return;

    const [row, col] = pos;

    // Check if position is occupied
    if (gameState.board.blackPieces[row][col] === 1 || gameState.board.whitePieces[row][col] === 1) {
        return;
    }

    // Update pending move (allows changing position without canceling first)
    gameState.pendingMove = { row, col };
    drawBoard();

    // Show confirmation buttons
    document.getElementById('move-confirm').classList.add('visible');
}

/**
 * Confirm pending move.
 */
async function confirmMove(event) {
    // Prevent iOS Safari scroll jump when button disappears
    if (event) {
        event.preventDefault();
    }

    const { row, col } = gameState.pendingMove;

    // Hide confirmation buttons
    document.getElementById('move-confirm').classList.remove('visible');

    // Make move
    await makePlayerMove(row, col);

    gameState.pendingMove = null;
}

/**
 * Cancel pending move.
 */
function cancelMove(event) {
    // Prevent iOS Safari scroll jump when button disappears
    if (event) {
        event.preventDefault();
    }

    gameState.pendingMove = null;
    document.getElementById('move-confirm').classList.remove('visible');
    drawBoard();
}

/**
 * Make a player move.
 */
async function makePlayerMove(row, col) {
    console.log(`Player move: (${row}, ${col})`);

    // Save to history
    gameState.history.push({
        row, col,
        player: gameState.playerColor,
        blackPieces: gameState.board.blackPieces.map(r => [...r]),
        whitePieces: gameState.board.whitePieces.map(r => [...r]),
        whoToPlay: gameState.board.whoToPlay,
        occupiedCount: gameState.board.occupiedCount
    });

    // Make move
    const result = gameState.board.Move(row, col);

    drawBoard();

    // Check game result
    if (result !== GameState.CONTINUE) {
        handleGameEnd(result);
        return;
    }

    // AI's turn
    await makeAIMove();
}

/**
 * Make an AI move.
 */
async function makeAIMove() {
    gameState.isAIThinking = true;

    // Check if using advanced difficulty (negamax search)
    const useNegamax = gameState.modelManager.selectedModel === 'advanced';

    if (useNegamax) {
        updateStatus('深度思考中...');
    } else {
        updateStatus('AI思考中...');
    }

    try {
        // Give browser a chance to update UI before heavy computation
        await new Promise(resolve => setTimeout(resolve, 50));

        // Get AI move
        const startTime = performance.now();
        let aiRow, aiCol, aiValue;

        if (useNegamax) {
            // Advanced difficulty: use negamax search (depth=3, topK=3)
            [aiRow, aiCol, aiValue] = await gameState.aiPlayer.getMoveWithNegamax(gameState.board, 3, 3);
        } else {
            // Junior/Intermediate: sample from policy distribution
            [aiRow, aiCol, aiValue] = await gameState.aiPlayer.getMove(gameState.board);
        }

        const endTime = performance.now();

        gameState.lastAIThinkTime = (endTime - startTime) / 1000; // Convert to seconds

        console.log(`AI move: (${aiRow}, ${aiCol}), think time: ${gameState.lastAIThinkTime.toFixed(2)}s`);

        // Save to history (value is from AI's perspective before this move)
        gameState.history.push({
            row: aiRow, col: aiCol,
            player: gameState.aiColor,
            value: aiValue,
            blackPieces: gameState.board.blackPieces.map(r => [...r]),
            whitePieces: gameState.board.whitePieces.map(r => [...r]),
            whoToPlay: gameState.board.whoToPlay,
            occupiedCount: gameState.board.occupiedCount
        });

        // Make move
        const result = gameState.board.Move(aiRow, aiCol);

        drawBoard();

        gameState.isAIThinking = false;

        // Check game result
        if (result !== GameState.CONTINUE) {
            handleGameEnd(result);
            return;
        }

        // Player's turn
        updateStatus('你的回合');

    } catch (error) {
        console.error('AI move failed:', error);
        gameState.isAIThinking = false;
        updateStatus('AI出错,请重新开始');
    }
}

/**
 * Undo last move (player + AI).
 */
function undoMove() {
    if (!gameState.board) return;
    if (gameState.gameOver) return;
    if (gameState.history.length === 0) return;
    if (gameState.isAIThinking) return;
    if (gameState.pendingMove) return;

    gameState.undoCount++;

    // Pop the last 2 moves (AI + player), or as many as available.
    // History stores snapshots BEFORE each move, so we must restore the
    // oldest popped snapshot to roll back exactly those moves.
    const movesToUndo = Math.min(2, gameState.history.length);
    let restoreState = null;
    for (let i = 0; i < movesToUndo; i++) {
        restoreState = gameState.history.pop();
    }

    // Restore board state from the oldest popped snapshot.
    if (restoreState) {
        gameState.board.blackPieces = restoreState.blackPieces.map(r => [...r]);
        gameState.board.whitePieces = restoreState.whitePieces.map(r => [...r]);
        gameState.board.whoToPlay = restoreState.whoToPlay;
        gameState.board.occupiedCount = restoreState.occupiedCount;
    } else {
        // No snapshot available, reset to initial state.
        gameState.board = new GomokuBoard();
    }

    drawBoard();
    if (gameState.board.whoToPlay === gameState.playerColor) {
        updateStatus('你的回合');
    } else {
        updateStatus('AI思考中...');
        makeAIMove();
    }
}

/**
 * Handle game end.
 */
function handleGameEnd(result) {
    console.log(`Game ended: ${result}`);
    gameState.gameOver = true;

    // Determine result title
    let title = '游戏结束';
    if (result === GameState.BLACK_WIN) {
        title = gameState.playerColor === Player.BLACK ? '你赢了！' : '你输了！';
    } else if (result === GameState.WHITE_WIN) {
        title = gameState.playerColor === Player.WHITE ? '你赢了！' : '你输了！';
    } else if (result === GameState.DRAW) {
        title = '平局';
    }

    // Player info
    const aiName = AI_DISPLAY_NAMES[gameState.modelManager.selectedModel] || 'AI';
    const fullAiName = 'Askr-' + aiName;
    const blackDot = '<span class="record-piece record-piece-black"></span>';
    const whiteDot = '<span class="record-piece record-piece-white"></span>';
    const blackLabel = gameState.playerColor === Player.BLACK ? '玩家' : fullAiName;
    const whiteLabel = gameState.playerColor === Player.WHITE ? '玩家' : fullAiName;

    // Stats
    const gameLength = gameState.history.length;
    const userWon = (result === GameState.BLACK_WIN && gameState.playerColor === Player.BLACK) ||
                    (result === GameState.WHITE_WIN && gameState.playerColor === Player.WHITE);
    let rightHtml = gameLength + '手';
    if (gameState.undoCount > 0 && userWon) {
        rightHtml += '<br>悔棋' + gameState.undoCount + '次';
    }

    // Replace top-controls content in-place: hide buttons, show stats
    document.getElementById('btn-undo').style.display = 'none';
    document.getElementById('btn-restart').style.display = 'none';
    const statLeft = document.getElementById('end-stat-left');
    const statRight = document.getElementById('end-stat-right');
    statLeft.innerHTML = blackDot + ' ' + blackLabel + '<br>' + whiteDot + ' ' + whiteLabel;
    statRight.innerHTML = rightHtml;
    statLeft.style.display = 'block';
    statRight.style.display = 'block';
    updateStatus(title);

    // Switch bottom area: hide move-confirm, show end actions
    document.getElementById('move-confirm').style.display = 'none';
    document.getElementById('end-actions').style.display = 'flex';

    // Disable board interaction
    canvas.style.cursor = 'default';

    // Draw record-style board with move numbers and winning line
    drawBoardRecord();
}

// ============================================================================
// Drawing
// ============================================================================

/**
 * Update canvas size (responsive).
 */
function updateCanvasSize() {
    const container = document.querySelector('.board-container');
    const containerWidth = container.clientWidth;

    // Limit to 600px max
    const maxSize = Math.min(containerWidth, 600);

    // Apply device pixel ratio for high-DPI displays
    const dpr = window.devicePixelRatio || 1;

    // Set CSS size (display size)
    canvas.style.width = maxSize + 'px';
    canvas.style.height = maxSize + 'px';

    // Set internal resolution (physical pixels)
    canvas.width = maxSize * dpr;
    canvas.height = maxSize * dpr;

    // Scale context to match DPR
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    if (gameState.gameOver) {
        drawBoardRecord();
    } else {
        drawBoard();
    }
}

/**
 * Draw the game board.
 */
function drawBoard() {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width;
    const padding = size * 0.05;
    const gridSize = (size - 2 * padding) / 14;

    // Clear canvas
    ctx.fillStyle = '#F8F8F8';
    ctx.fillRect(0, 0, size, size);

    // Draw grid
    ctx.strokeStyle = '#808080';
    ctx.lineWidth = 1;

    for (let i = 0; i < 15; i++) {
        // Vertical lines
        ctx.beginPath();
        ctx.moveTo(padding + i * gridSize, padding);
        ctx.lineTo(padding + i * gridSize, padding + 14 * gridSize);
        ctx.stroke();

        // Horizontal lines
        ctx.beginPath();
        ctx.moveTo(padding, padding + i * gridSize);
        ctx.lineTo(padding + 14 * gridSize, padding + i * gridSize);
        ctx.stroke();
    }

    // Draw star points
    ctx.fillStyle = '#404040';
    const starPoints = [
        [3, 3], [3, 11], [11, 3], [11, 11], [7, 7]
    ];

    for (const [row, col] of starPoints) {
        const x = padding + col * gridSize;
        const y = padding + row * gridSize;
        ctx.beginPath();
        ctx.arc(x, y, size * 0.008, 0, 2 * Math.PI);
        ctx.fill();
    }

    // Draw pieces
    const pieceRadius = gridSize * 0.4;

    for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
            const x = padding + col * gridSize;
            const y = padding + row * gridSize;

            if (gameState.board.blackPieces[row][col] === 1) {
                // Black piece
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
                ctx.fill();
            } else if (gameState.board.whitePieces[row][col] === 1) {
                // White piece
                ctx.fillStyle = '#FFF';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();
            }
        }
    }

    // Draw pending move (semi-transparent)
    if (gameState.pendingMove) {
        const { row, col } = gameState.pendingMove;
        const x = padding + col * gridSize;
        const y = padding + row * gridSize;

        const color = gameState.playerColor === Player.BLACK ? '#000' : '#FFF';
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
        ctx.fill();

        if (gameState.playerColor === Player.WHITE) {
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        ctx.globalAlpha = 1.0;
    }

    // Draw last move marker - only for AI moves
    if (gameState.history.length > 0) {
        const lastMove = gameState.history[gameState.history.length - 1];
        if (lastMove.player === gameState.aiColor) {
            const x = padding + lastMove.col * gridSize;
            const y = padding + lastMove.row * gridSize;

            if (lastMove.player === Player.BLACK) {
                // White cross on black piece
                const halfLen = pieceRadius * 0.375;
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x - halfLen, y);
                ctx.lineTo(x + halfLen, y);
                ctx.moveTo(x, y - halfLen);
                ctx.lineTo(x, y + halfLen);
                ctx.stroke();
            } else {
                // Black dot on white piece
                const dotRadius = pieceRadius * 0.2;
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(x, y, dotRadius, 0, 2 * Math.PI);
                ctx.fill();
            }
        }
    }
}

/**
 * Draw the game board in record mode (with move numbers and winning line).
 */
function drawBoardRecord() {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width;
    const padding = size * 0.05;
    const gridSize = (size - 2 * padding) / 14;
    const pieceRadius = gridSize * 0.4;

    // Clear canvas
    ctx.fillStyle = '#F8F8F8';
    ctx.fillRect(0, 0, size, size);

    // Draw grid
    ctx.strokeStyle = '#808080';
    ctx.lineWidth = 1;
    for (let i = 0; i < 15; i++) {
        ctx.beginPath();
        ctx.moveTo(padding + i * gridSize, padding);
        ctx.lineTo(padding + i * gridSize, padding + 14 * gridSize);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(padding, padding + i * gridSize);
        ctx.lineTo(padding + 14 * gridSize, padding + i * gridSize);
        ctx.stroke();
    }

    // Star points
    ctx.fillStyle = '#404040';
    const starPoints = [[3,3],[3,11],[11,3],[11,11],[7,7]];
    for (const [row, col] of starPoints) {
        ctx.beginPath();
        ctx.arc(padding + col * gridSize, padding + row * gridSize, size * 0.008, 0, 2 * Math.PI);
        ctx.fill();
    }

    // Winning line (drawn beneath pieces)
    const winLine = findWinningLine();
    if (winLine) {
        const first = winLine[0];
        const last = winLine[winLine.length - 1];
        ctx.strokeStyle = '#CC0000';
        ctx.lineWidth = size < 500 ? 3 : 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(padding + first[1] * gridSize, padding + first[0] * gridSize);
        ctx.lineTo(padding + last[1] * gridSize, padding + last[0] * gridSize);
        ctx.stroke();
    }

    // Pieces with move numbers
    for (let i = 0; i < gameState.history.length; i++) {
        const move = gameState.history[i];
        const moveNum = i + 1;
        const x = padding + move.col * gridSize;
        const y = padding + move.row * gridSize;
        const isBlack = move.player === Player.BLACK;

        if (isBlack) {
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
            ctx.fill();
        } else {
            ctx.fillStyle = '#FFF';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x, y, pieceRadius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
        }

        // Move number
        ctx.fillStyle = isBlack ? '#FFF' : '#000';
        const digits = String(moveNum).length;
        const fontSize = digits <= 1 ? pieceRadius * 1.2 : digits <= 2 ? pieceRadius * 1.0 : pieceRadius * 0.8;
        ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(moveNum), x, y);
    }
}

/**
 * Convert screen coordinates to board position.
 */
function screenToBoard(x, y) {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width;
    const padding = size * 0.05;
    const gridSize = (size - 2 * padding) / 14;

    const col = Math.round((x - padding) / gridSize);
    const row = Math.round((y - padding) / gridSize);

    if (row < 0 || row >= 15 || col < 0 || col >= 15) {
        return null;
    }

    return [row, col];
}

/**
 * Update status text.
 */
function updateStatus(text) {
    document.getElementById('status-text').textContent = text;
}

// ============================================================================
// Orbital Loading Animation
// ============================================================================

let orbitAnimationRunning = false;
let orbitAnimationFrame = null;
let orbitLines = [];

/**
 * Start the orbital animation.
 */
function startOrbitAnimation() {
    orbitAnimationRunning = true;

    // Clean up any existing lines
    cleanupOrbitLines();

    const orbitLinesContainer = document.getElementById('orbit-lines');

    // Get planet elements
    const planet1 = document.querySelector('.planet-1');
    const planet2 = document.querySelector('.planet-2');
    const planet3 = document.querySelector('.planet-3');

    // Create lines (3 lines connecting the planets in a triangle)
    for (let i = 0; i < 3; i++) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', '#999');
        line.setAttribute('stroke-width', '1');
        orbitLinesContainer.appendChild(line);
        orbitLines.push(line);
    }

    // Animation function
    function animate() {
        if (!orbitAnimationRunning) return;

        // Get planet positions
        const pos1 = getPlanetPosition(planet1);
        const pos2 = getPlanetPosition(planet2);
        const pos3 = getPlanetPosition(planet3);

        // Update lines
        // Line 0: planet1 -> planet2
        orbitLines[0].setAttribute('x1', pos1.x);
        orbitLines[0].setAttribute('y1', pos1.y);
        orbitLines[0].setAttribute('x2', pos2.x);
        orbitLines[0].setAttribute('y2', pos2.y);

        // Line 1: planet2 -> planet3
        orbitLines[1].setAttribute('x1', pos2.x);
        orbitLines[1].setAttribute('y1', pos2.y);
        orbitLines[1].setAttribute('x2', pos3.x);
        orbitLines[1].setAttribute('y2', pos3.y);

        // Line 2: planet3 -> planet1
        orbitLines[2].setAttribute('x1', pos3.x);
        orbitLines[2].setAttribute('y1', pos3.y);
        orbitLines[2].setAttribute('x2', pos1.x);
        orbitLines[2].setAttribute('y2', pos1.y);

        orbitAnimationFrame = requestAnimationFrame(animate);
    }

    animate();
}

/**
 * Stop the orbital animation.
 */
function stopOrbitAnimation() {
    orbitAnimationRunning = false;
    cancelAnimationFrame(orbitAnimationFrame);
    orbitAnimationFrame = null;
    cleanupOrbitLines();
}

/**
 * Clean up orbit lines from DOM.
 */
function cleanupOrbitLines() {
    orbitLines.forEach(line => line.parentNode.removeChild(line));
    orbitLines = [];
}

/**
 * Get planet position in SVG coordinates.
 */
function getPlanetPosition(planet) {
    const ctm = planet.getCTM();
    return { x: ctm.e, y: ctm.f };
}

// ============================================================================
// Record Screen (numbered board for screenshots)
// ============================================================================

const AI_DISPLAY_NAMES = { junior: 'Vibe', intermediate: 'Mood', advanced: 'Melody' };

/**
 * Show the record screen with a numbered board.
 */
function showRecordScreen() {
    const aiName = AI_DISPLAY_NAMES[gameState.modelManager.selectedModel] || 'AI';

    // Populate player labels
    const blackLabel = gameState.playerColor === Player.BLACK ? '\u73a9\u5bb6' : aiName;
    const whiteLabel = gameState.playerColor === Player.WHITE ? '\u73a9\u5bb6' : aiName;
    const blackDot = '<span class="record-piece record-piece-black"></span>';
    const whiteDot = '<span class="record-piece record-piece-white"></span>';
    document.getElementById('record-black').innerHTML = blackDot + ' \u9ed1\u68cb\uff1a' + blackLabel;
    document.getElementById('record-white').innerHTML = whiteDot + ' \u767d\u68cb\uff1a' + whiteLabel;

    // Regret (only if > 0)
    if (gameState.undoCount > 0) {
        document.getElementById('record-regret').textContent = '\u608d\u68cb\u6b21\u6570\uff1a' + gameState.undoCount;
    } else {
        document.getElementById('record-regret').textContent = '';
    }

    // Game length
    document.getElementById('record-length').textContent = '\u68cb\u5c40\u957f\u5ea6\uff1a' + gameState.history.length;

    document.getElementById('record-screen').style.display = 'flex';
    drawRecordBoard();
}

/**
 * Hide the record screen.
 */
function hideRecordScreen() {
    document.getElementById('record-screen').style.display = 'none';
}

/**
 * Find the winning line (5+ in a row) from the last move.
 * @returns {Array|null} Array of [row, col] pairs sorted by position, or null
 */
function findWinningLine() {
    if (gameState.history.length === 0) return null;

    const lastMove = gameState.history[gameState.history.length - 1];
    const { row, col, player } = lastMove;
    const pieces = player === Player.BLACK ? gameState.board.blackPieces : gameState.board.whitePieces;

    const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

    for (const [dr, dc] of directions) {
        const line = [[row, col]];

        let r = row + dr, c = col + dc;
        while (r >= 0 && r < 15 && c >= 0 && c < 15 && pieces[r][c] === 1) {
            line.push([r, c]);
            r += dr; c += dc;
        }

        r = row - dr; c = col - dc;
        while (r >= 0 && r < 15 && c >= 0 && c < 15 && pieces[r][c] === 1) {
            line.push([r, c]);
            r -= dr; c -= dc;
        }

        if (line.length >= 5) {
            line.sort((a, b) => a[0] !== b[0] ? a[0] - b[0] : a[1] - b[1]);
            return line;
        }
    }

    return null;
}

/**
 * Draw the numbered board onto the record canvas.
 */
function drawRecordBoard() {
    const recordCanvas = document.getElementById('record-board');
    const c = recordCanvas.getContext('2d');

    // Size the canvas to fit the viewport (square, capped at 600px CSS)
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const cssSize = Math.min(vw - 40, vh - 80, 600);
    const dpr = window.devicePixelRatio || 1;

    recordCanvas.style.width = cssSize + 'px';
    recordCanvas.style.height = cssSize + 'px';
    recordCanvas.width = cssSize * dpr;
    recordCanvas.height = cssSize * dpr;

    // Match content wrapper width to canvas
    document.getElementById('record-content').style.width = cssSize + 'px';

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.scale(dpr, dpr);

    const size = cssSize;
    const padding = size * 0.05;
    const gridSize = (size - 2 * padding) / 14;
    const pieceRadius = gridSize * 0.4;

    // Background
    c.fillStyle = '#F8F8F8';
    c.fillRect(0, 0, size, size);

    // Grid lines
    c.strokeStyle = '#808080';
    c.lineWidth = 1;
    for (let i = 0; i < 15; i++) {
        c.beginPath();
        c.moveTo(padding + i * gridSize, padding);
        c.lineTo(padding + i * gridSize, padding + 14 * gridSize);
        c.stroke();

        c.beginPath();
        c.moveTo(padding, padding + i * gridSize);
        c.lineTo(padding + 14 * gridSize, padding + i * gridSize);
        c.stroke();
    }

    // Star points
    c.fillStyle = '#404040';
    const starPoints = [[3,3],[3,11],[11,3],[11,11],[7,7]];
    for (const [row, col] of starPoints) {
        c.beginPath();
        c.arc(padding + col * gridSize, padding + row * gridSize, size * 0.008, 0, 2 * Math.PI);
        c.fill();
    }

    // Winning line (drawn beneath pieces)
    const winLine = findWinningLine();
    if (winLine) {
        const first = winLine[0];
        const last = winLine[winLine.length - 1];
        c.strokeStyle = '#CC0000';
        c.lineWidth = cssSize < 500 ? 3 : 5;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(padding + first[1] * gridSize, padding + first[0] * gridSize);
        c.lineTo(padding + last[1] * gridSize, padding + last[0] * gridSize);
        c.stroke();
    }

    // Pieces with move numbers
    for (let i = 0; i < gameState.history.length; i++) {
        const move = gameState.history[i];
        const moveNum = i + 1;
        const x = padding + move.col * gridSize;
        const y = padding + move.row * gridSize;
        const isBlack = move.player === Player.BLACK;

        // Draw piece
        if (isBlack) {
            c.fillStyle = '#000';
            c.beginPath();
            c.arc(x, y, pieceRadius, 0, 2 * Math.PI);
            c.fill();
        } else {
            c.fillStyle = '#FFF';
            c.strokeStyle = '#000';
            c.lineWidth = 1.5;
            c.beginPath();
            c.arc(x, y, pieceRadius, 0, 2 * Math.PI);
            c.fill();
            c.stroke();
        }

        // Draw number
        c.fillStyle = isBlack ? '#FFF' : '#000';
        const digits = String(moveNum).length;
        const fontSize = digits <= 1 ? pieceRadius * 1.2 : digits <= 2 ? pieceRadius * 1.0 : pieceRadius * 0.8;
        c.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(String(moveNum), x, y);
    }
}
