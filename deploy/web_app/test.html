<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gomoku MCTS Test Page</title>
<style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    .env { background: #f8f8f8; border: 1px solid #ddd; padding: 0.6rem 1rem; font-size: 0.9rem; }
    button { margin: 0.8rem 0.4rem 0.8rem 0; padding: 0.4rem 0.9rem; border: 1px solid #888;
        border-radius: 4px; background: #fff; cursor: pointer; }
    button:disabled { opacity: 0.4; }
    pre { background: #f4f4f4; border: 1px solid #ddd; padding: 0.8rem; font-size: 0.85rem;
        white-space: pre-wrap; }
    .pass { color: #080; }
    .fail { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<h1>Gomoku MCTS Test Page (dev only)</h1>
<p>Runs the tactical/invariant test suite against the real melody model with
the real search code, in this browser. Compare the CROSSCHECK lines across
devices/EPs — they should be identical up to float noise.</p>

<div class="env" id="env-info"></div>
<div>
    <button id="run-wasm">Run tests (WASM)</button>
    <button id="run-webgpu">Run tests (WebGPU)</button>
</div>
<pre id="log"></pre>

<script src="vendor/ort.webgpu.min.js"></script>
<script src="js/asset-paths.js"></script>
<script src="js/i18n.js"></script>
<script src="js/gomoku-board.js?v=20260726-server-eval-cache"></script>
<script src="js/mcts.js?v=20260726-server-eval-cache"></script>
<script src="js/ep-probe.js"></script>
<script src="js/eval-cache.js?v=20260726-server-eval-cache"></script>
<script src="js/onnx-ai-player.js?v=20260726-server-eval-cache"></script>
<script>
const MODEL = 'models/curtain.onnx';
const logEl = document.getElementById('log');
let failures = 0;

function log(msg, cls) {
    const span = document.createElement('span');
    span.textContent = msg + '\n';
    if (cls) span.className = cls;
    logEl.appendChild(span);
}

function check(cond, msg) {
    log((cond ? 'PASS' : 'FAIL') + ': ' + msg, cond ? 'pass' : 'fail');
    if (!cond) failures++;
}

// The played move is sampled from the visit counts (MCTS_ACTION_TEMPERATURE),
// so tactical assertions target the deterministic search statistics instead:
// the argmax-visits action and the visit counts themselves.
function argmaxAction(root) {
    let bestK = 0;
    for (let k = 0; k < root.childN.length; k++) {
        if (root.childN[k] > root.childN[bestK]) bestK = k;
    }
    return root.childActions[bestK];
}

function makeBoard(moves) {
    const b = new GomokuBoard();
    for (const [r, c] of moves) {
        if (b.Move(r, c) !== GameState.CONTINUE) throw new Error('unexpected terminal');
    }
    return b;
}

async function dumpCrosscheck(player, label, moves) {
    const res = await new MCTSSearch(player).search(makeBoard(moves), 128);
    const root = res.root;
    const entries = [];
    for (let k = 0; k < root.childActions.length; k++) {
        if (root.childN[k] > 0) entries.push([root.childActions[k], root.childN[k]]);
    }
    entries.sort((a, b) => b[1] - a[1]);
    log(`CROSSCHECK ${label} rootQ=${res.rootQ.toFixed(4)} `
        + `top=${entries.slice(0, 10).map(e => `${e[0]}:${e[1]}`).join(' ')}`);
}

async function runTests(ep) {
    failures = 0;
    logEl.textContent = '';

    // Position keys are exact board-state keys, independent of the order in
    // which each side placed its stones.
    {
        const abcd = makeBoard([[7,7],[7,8],[8,8],[6,6]]);
        const cbad = makeBoard([[8,8],[7,8],[7,7],[6,6]]);
        check(abcd.GetEvalCacheKey() === cbad.GetEvalCacheKey(),
            'eval-cache key matches across a move-order transposition');
        const different = makeBoard([[7,7],[7,8],[8,7],[6,6]]);
        check(abcd.GetEvalCacheKey() !== different.GetEvalCacheKey(),
            'eval-cache key distinguishes different stone sets');
    }

    // Parse one complete binary-format record and reject a model mismatch.
    {
        const hash = new Uint8Array(EVAL_CACHE_MODEL_HASH_SIZE).fill(0x5a);
        const file = new ArrayBuffer(EVAL_CACHE_HEADER_SIZE + EVAL_CACHE_RECORD_SIZE);
        const view = new DataView(file);
        for (let i = 0; i < EVAL_CACHE_MAGIC.length; i++) {
            view.setUint8(i, EVAL_CACHE_MAGIC.charCodeAt(i));
        }
        view.setUint16(0x08, EVAL_CACHE_FORMAT_VERSION, true);
        view.setUint16(0x0a, EVAL_CACHE_BOARD_SIZE, true);
        view.setUint16(0x0c, EVAL_CACHE_POLICY_SIZE, true);
        view.setUint16(0x0e, 1, true);
        view.setUint32(0x10, EVAL_CACHE_RECORD_SIZE, true);
        for (let i = 0; i < hash.length; i++) {
            view.setUint8(EVAL_CACHE_HEADER_MODEL_HASH_OFFSET + i, hash[i]);
        }
        const parsed = evalCacheParseFile(file, hash, 2);
        check(parsed.length === 1
                && parsed[0].key === makeBoard([]).GetEvalCacheKey()
                && parsed[0].evaluation.logits.length === 225
                && parsed[0].evaluation.value === 0,
            'binary eval-cache v1 record parses correctly');

        const wrongHash = hash.slice();
        wrongHash[0] ^= 0xff;
        let rejectedMismatch = false;
        try {
            evalCacheParseFile(file, wrongHash, 2);
        } catch (_) {
            rejectedMismatch = true;
        }
        check(rejectedMismatch, 'binary eval cache rejects a different model hash');
    }

    // Verify real LRU promotion: after A,B,A,C, B must be the entry evicted.
    {
        let runs = 0;
        const cachePlayer = new OnnxAIPlayer('fake', 1.0, 2);
        cachePlayer.session = {
            run: async () => {
                runs++;
                return {
                    policy_logits: { data: new Float32Array(225).fill(runs) },
                    value: { data: new Float32Array([runs / 10]) },
                };
            },
        };
        const a = makeBoard([]);
        const b = makeBoard([[7,7]]);
        const c = makeBoard([[8,8]]);
        await cachePlayer.evaluate(a);
        await cachePlayer.evaluate(b);
        await cachePlayer.evaluate(a);
        await cachePlayer.evaluate(c);
        await cachePlayer.evaluate(b);
        const stats = cachePlayer.getEvalCacheStats();
        check(runs === 4 && stats.hits === 1 && stats.misses === 4,
            `eval LRU hit/miss accounting: runs=${runs}, hits=${stats.hits}, misses=${stats.misses}`);
        check(stats.evictions === 2 && stats.size === 2,
            `eval LRU promotion and eviction: evictions=${stats.evictions}, size=${stats.size}`);
        cachePlayer.resetEvalCache();
        const reset = cachePlayer.getEvalCacheStats();
        check(reset.size === 0 && reset.hits === 0 && reset.misses === 0,
            'new-game reset clears eval cache and statistics');
    }

    // A new game restores server entries in their original oldest-to-newest
    // order instead of retaining dynamic entries from the previous game.
    {
        let runs = 0;
        const seededPlayer = new OnnxAIPlayer('fake', 1.0, 2);
        seededPlayer.session = {
            run: async () => {
                runs++;
                return {
                    policy_logits: { data: new Float32Array(225).fill(9) },
                    value: { data: new Float32Array([0.9]) },
                };
            },
        };
        const a = makeBoard([]);
        const b = makeBoard([[7,7]]);
        const c = makeBoard([[8,8]]);
        const seedEvalA = {
            logits: new Float32Array(225).fill(1),
            value: 0.1,
        };
        const seedEvalB = {
            logits: new Float32Array(225).fill(2),
            value: 0.2,
        };
        seededPlayer.setEvalCacheSeed([
            { key: a.GetEvalCacheKey(), evaluation: seedEvalA },
            { key: b.GetEvalCacheKey(), evaluation: seedEvalB },
        ]);
        await seededPlayer.evaluate(a); // hit promotes A; B is now oldest
        await seededPlayer.evaluate(c); // miss evicts B
        check(runs === 1 && seededPlayer.getEvalCacheStats().seedEntries === 2,
            'server seed participates in the runtime LRU');
        seededPlayer.resetEvalCache();
        const restored = seededPlayer.getEvalCacheStats();
        const restoredB = await seededPlayer.evaluate(b);
        check(restored.size === 2 && restored.hits === 0 && restored.misses === 0,
            'new-game reset restores server seed and clears statistics');
        check(runs === 1 && restoredB.value === seedEvalB.value,
            'restored server entry avoids ONNX inference');
    }

    log(`Creating ${ep} session...`);
    const player = new OnnxAIPlayer(MODEL, 1.0, MCTS_EVAL_CACHE_MAX_ENTRIES);
    player.session = await ort.InferenceSession.create(MODEL, {
        executionProviders: [ep],
        graphOptimizationLevel: 'all',
    });

    // 1. Win-in-1: Black to move with an open four at row 7, cols 3-6.
    {
        const b = makeBoard([[7,3],[0,0],[7,4],[0,1],[7,5],[0,2],[7,6],[14,14]]);
        const t0 = performance.now();
        const res = await new MCTSSearch(player).search(b, 128);
        log(`128 sims took ${((performance.now() - t0) / 1000).toFixed(2)}s`);
        const top = argmaxAction(res.root);
        check(top === 7 * 15 + 2 || top === 7 * 15 + 7,
            `win-in-1 argmax-visits is a winning square: got (${Math.floor(top / 15)},${top % 15})`);
        const root = res.root;
        let winN = 0, tot = 0;
        for (let k = 0; k < root.childActions.length; k++) {
            tot += root.childN[k];
            const a = root.childActions[k];
            if (a === 7 * 15 + 2 || a === 7 * 15 + 7) winN += root.childN[k];
        }
        check(winN / tot > 0.7, `win-in-1 visit share on winning squares: ${(winN / tot).toFixed(3)}`);
        check(tot === 128, `sum(childN) == numSims: ${tot}`);
        check(root.visitCount === 129, `root visitCount == numSims + 1: ${root.visitCount}`);
        check(res.rootQ >= -1 && res.rootQ <= 1, `rootQ in [-1,1]: ${res.rootQ.toFixed(4)}`);
    }

    // 2. Block-win-in-1: White to move; (7,7) is Black's only winning square.
    {
        const b = makeBoard([[7,3],[7,2],[7,4],[0,0],[7,5],[0,1],[7,6]]);
        const res = await new MCTSSearch(player).search(b, 128);
        const top = argmaxAction(res.root);
        check(top === 7 * 15 + 7,
            `block-win-in-1 argmax-visits is the blocking square: got (${Math.floor(top / 15)},${top % 15})`);
    }

    // 3. Determinism of the search (the played move is sampled, the
    //    visit counts and rootQ must not be).
    {
        const moves = [[7,7],[7,8],[8,8],[6,6]];
        const r1 = await new MCTSSearch(player).search(makeBoard(moves), 64);
        const r2 = await new MCTSSearch(player).search(makeBoard(moves), 64);
        let same = r1.rootQ === r2.rootQ
            && r1.root.childN.length === r2.root.childN.length;
        for (let k = 0; same && k < r1.root.childN.length; k++) {
            same = r1.root.childN[k] === r2.root.childN[k];
        }
        check(same, `deterministic search: visit vectors match, `
            + `rootQ ${r1.rootQ.toFixed(4)} == ${r2.rootQ.toFixed(4)}`);
    }

    // 4. Cross-check dumps (compare with Node/Python harness output).
    await dumpCrosscheck(player, 'pos1', [[7,7],[7,8],[8,8],[6,6],[8,6],[6,8]]);
    await dumpCrosscheck(player, 'pos2', [[7,7],[8,8],[6,8],[8,6],[9,7]]);

    const cache = player.getEvalCacheStats();
    const cacheLookups = cache.hits + cache.misses;
    log(`EVAL CACHE hits=${cache.hits}/${cacheLookups} `
        + `(${(100 * cache.hits / cacheLookups).toFixed(1)}%) `
        + `evictions=${cache.evictions} size=${cache.size}/${cache.maxEntries}`);
    await player.session.release();
    log(failures === 0 ? 'ALL TESTS PASSED' : `${failures} FAILURES`,
        failures === 0 ? 'pass' : 'fail');
}

epProbeConfigureOrtEnv();
const env = epProbeEnvironment();
document.getElementById('env-info').textContent =
    `crossOriginIsolated: ${env.isolated} · WebGPU: ${env.hasGpu} · cores: ${env.cores}`
    + ` · wasm threads: ${ort.env.wasm.numThreads}`;
document.getElementById('run-webgpu').disabled = !env.hasGpu;

for (const [id, ep] of [['run-wasm', 'wasm'], ['run-webgpu', 'webgpu']]) {
    document.getElementById(id).addEventListener('click', async (e) => {
        e.target.disabled = true;
        try { await runTests(ep); }
        catch (err) { log('ERROR: ' + (err.message || err), 'fail'); }
        finally { e.target.disabled = false; }
    });
}
</script>
</body>
</html>
